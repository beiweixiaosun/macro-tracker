        if (!navigator.vibrate) return;

        else if (type === 'success') navigator.vibrate([20, 45, 35]);

    const getLocalDateStr = (dateObj = new Date()) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const shiftDateStr = (dateStr, days) => {
      if (!dateStr || typeof dateStr !== 'string') return getLocalDateStr();
      const cleanStr = dateStr.trim().replace(/\//g, '-');
      const parts = cleanStr.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return getLocalDateStr();
      const dt = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
      dt.setDate(dt.getDate() + Number(days));
      return getLocalDateStr(dt);
    };

    const compressImageFile = (file, maxWidth = 800, quality = 0.8) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({ dataUrl, base64Data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.onerror = reject; img.src = e.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    };

    const extractJsonObjects = (rawText) => {
      if (!rawText || typeof rawText !== 'string') return [];
      const cleaned = rawText.replace(/```json|```/gi, '').trim();
      try {
        const direct = JSON.parse(cleaned);
        return Array.isArray(direct) ? direct : [direct];
      } catch (e) {}

      const extracted = [];
      let depth = 0, startIdx = -1, inStr = false, escape = false;
      for (let i = 0; i < cleaned.length; i++) {
        const ch = cleaned[i];
        if (escape) { escape = false; continue; }
        if (ch === '\\' && inStr) { escape = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (!inStr) {
          if (ch === '{') {
            if (depth === 0) startIdx = i;
            depth++;
          } else if (ch === '}') {
            depth--;
            if (depth === 0 && startIdx !== -1) {
              try { extracted.push(JSON.parse(cleaned.slice(startIdx, i + 1))); } catch (err) {}
              startIdx = -1;
            }
          }
        }
      }
      return extracted;
    };

        else if (obj.name && (obj.carb !== undefined || obj.pro !== undefined || obj.fat !== undefined)) finalFoods.push(obj);

      return finalFoods;

      const [historyDB, setHistoryDB] = useState(() => {

      const [activeCategory, setActiveCategory] = useState('全部');

      const [exFilter, setExFilter] = useState('全部');

      const [logDuration, setLogDuration] = useState(30);

      useEffect(() => { try { localStorage.setItem('macro_profile_v4', JSON.stringify(profile)); } catch (e) {} }, [profile]);
      useEffect(() => { try { localStorage.setItem('macro_history_v5', JSON.stringify(historyDB)); } catch (e) {} }, [historyDB]);
      useEffect(() => { try { localStorage.setItem('macro_ai_config_v7', JSON.stringify(aiConfig)); } catch (e) {} }, [aiConfig]);
      useEffect(() => { try { localStorage.setItem('macro_user_foods_v8', JSON.stringify(userCustomDB)); } catch (e) {} }, [userCustomDB]);

      const changeDateByDays = (deltaDays) => {
        triggerHaptic('light');
        setSelectedDate(prev => shiftDateStr(prev, deltaDays));

      };

      const openNativeDatePicker = () => {
        triggerHaptic('light');
        if (dateInputRef.current) {
          try {
            if (typeof dateInputRef.current.showPicker === 'function') {
              dateInputRef.current.showPicker();
            } else {
              dateInputRef.current.focus();
              dateInputRef.current.click();
            }

            dateInputRef.current.focus();
          }
        }
      };

      const currentDayRecordRaw = historyDB ? historyDB[selectedDate] : null;
      const currentDayData = currentDayRecordRaw || { weight: profile.weight, meals: [], workouts: [], checkedIn: false };
      const meals = Array.isArray(currentDayData.meals) ? currentDayData.meals : [];
      const workouts = Array.isArray(currentDayData.workouts) ? currentDayData.workouts : [];
      const activeWeight = Number(currentDayData.weight ?? profile.weight) || 70;
      const hasLoggedWeightToday = Boolean(currentDayRecordRaw && currentDayRecordRaw.weight !== undefined && currentDayRecordRaw.weight !== '');

      const updateDayRecord = (updater) => {
        setHistoryDB(prev => {
          const safePrev = prev && typeof prev === 'object' ? prev : {};
          const existing = safePrev[selectedDate] || { weight: profile.weight, meals: [], workouts: [], checkedIn: false };
          const updated = updater({
            weight: existing.weight ?? profile.weight,
            meals: Array.isArray(existing.meals) ? existing.meals : [],
            workouts: Array.isArray(existing.workouts) ? existing.workouts : [],
            checkedIn: Boolean(existing.checkedIn)
          });
          return { ...safePrev, [selectedDate]: updated };
        });
      };

      const handleDayWeightChange = (val) => {
        if (selectedDate === todayStr) setProfile(p => ({ ...p, weight: val }));
        updateDayRecord(rec => ({ ...rec, weight: val }));
      };

      const calcTdeeForWeight = (w) => {
        const { gender, age, height, activity } = profile;
        let bmr = (10 * (Number(w) || 70)) + (6.25 * (Number(height) || 175)) - (5 * (Number(age) || 26));
        bmr += gender === 'male' ? 5 : -161;
        const act = Number(activity) || 1.375;
        return { bmr: Math.max(800, Math.round(bmr)), tdee: Math.max(1000, Math.round(bmr * act)) };
      };

      const targets = useMemo(() => {
        const { bmr, tdee } = calcTdeeForWeight(activeWeight);
        const cfg = GOAL_CONFIGS[profile.goal] || GOAL_CONFIGS.cut;
        const cal = Math.max(800, Math.round(tdee * cfg.calMulti));
        return {
          bmr, tdee, cal,
          plannedDeficit: Math.round(tdee - cal),
          carb: Math.round((cal * cfg.carbRatio) / 4),
          pro: Math.round((cal * cfg.proRatio) / 4),
          fat: Math.round((cal * cfg.fatRatio) / 9)
        };
      }, [profile, activeWeight]);

      const totals = useMemo(() => {
        return meals.reduce((acc, item) => ({
          carb: +(acc.carb + (Number(item?.carb) || 0)).toFixed(1),
          pro: +(acc.pro + (Number(item?.pro) || 0)).toFixed(1),
          fat: +(acc.fat + (Number(item?.fat) || 0)).toFixed(1),
          cal: Math.round(acc.cal + (Number(item?.cal) || 0))
        }), { carb: 0, pro: 0, fat: 0, cal: 0 });
      }, [meals]);

      const burnedCalories = useMemo(() => workouts.reduce((sum, w) => sum + (Number(w?.cal) || 0), 0), [workouts]);
      const effectiveTargetCal = Math.max(800, targets.cal + burnedCalories);
      const calDiff = effectiveTargetCal - totals.cal;
      const actualDeficit = (targets.tdee + burnedCalories) - totals.cal;
      const weeklyWeightChangeKg = ((actualDeficit * 7) / 7700).toFixed(2);

      // 每日 3 大微习惯任务判定
      const dailyQuests = useMemo(() => {
        const q1 = hasLoggedWeightToday || meals.length > 0; // 已确认体重/开启今日记录
        const q2 = meals.length > 0;                        // 已记录至少1餐
        const q3 = (meals.length > 0 && calDiff >= 0) || workouts.length > 0; // 热量未超标或已运动打卡
        const doneCount = [q1, q2, q3].filter(Boolean).length;
        return { q1, q2, q3, doneCount, allDone: doneCount === 3 };
      }, [hasLoggedWeightToday, meals.length, calDiff, workouts.length]);

      // 当集齐3颗星时，自动触发一次礼花和震动奖励
      useEffect(() => {
        if (dailyQuests.allDone && !celebratedDatesRef.current[selectedDate]) {
          celebratedDatesRef.current[selectedDate] = true;
          triggerHaptic('celebrate');
          fireConfetti();
          setCheerQuote(CHEER_QUOTES[Math.floor(Math.random() * CHEER_QUOTES.length)]);
        }
      }, [dailyQuests.allDone, selectedDate]);

      // 动态暖心鼓励语（根据当日饮食状态实时变化）
      const dynamicEncouragement = useMemo(() => {
        if (meals.length === 0 && workouts.length === 0) {
          return { icon: '☀️', text: '新的一天开始啦！记下第一餐或体重，点亮今日健康星星吧～', bg: 'bg-indigo-50/90 border-indigo-200 text-indigo-950' };
        }
        if (totals.pro >= targets.pro * 0.85 && calDiff >= 0) {
          return { icon: '🏆', text: '太优秀了！今天蛋白质吃得超足，热量也稳稳当当，肌肉正在悄悄生长！', bg: 'bg-emerald-50 border-emerald-200 text-emerald-950' };
        }
        if (workouts.length > 0 && calDiff >= 0) {
          return { icon: '🔥', text: `今天不仅好好记录了饮食，还运动消耗了 ${burnedCalories} kcal，为你疯狂鼓掌！`, bg: 'bg-emerald-50 border-emerald-200 text-emerald-950' };

          setAiAdvice(`❌ AI点评生成失败：${err.message}`);
        } finally {
          setAiAdviceLoading(false);
        }
      };

      const buildBackupPayload = () => ({ version: 'v9.2', exportedAt: new Date().toISOString(), profile, aiConfig, historyDB, userCustomDB });

      const downloadJsonBackup = () => {
        triggerHaptic('light');
        const blob = new Blob([JSON.stringify(buildBackupPayload(), null, 2)], { type: 'application/json;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `macro_tracker_backup_${todayStr}.json`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        setSyncNotice('✅ 备份下载成功！');
      };

      const copySyncString = async () => {
        triggerHaptic('light');
        try {
          await navigator.clipboard.writeText(btoa(encodeURIComponent(JSON.stringify(buildBackupPayload()))));
          setSyncNotice('✅ 同步码已复制到剪贴板！');
        } catch (err) { setSyncNotice('❌ 复制失败'); }
      };

      const handleSyncCodeRestore = () => {
        triggerHaptic('medium');
        const raw = syncCodeInput.trim();
        if (!raw) return;
        try {
          const parsed = raw.startsWith('{') ? JSON.parse(raw) : JSON.parse(decodeURIComponent(atob(raw)));
          if (parsed.profile) setProfile(prev => ({ ...prev, ...parsed.profile }));
          if (parsed.aiConfig?.apiKey) setAiConfig(prev => ({ ...prev, ...parsed.aiConfig }));
          if (Array.isArray(parsed.userCustomDB)) setUserCustomDB(parsed.userCustomDB);
          if (parsed.historyDB) {
            setHistoryDB(prev => importMode === 'overwrite' ? parsed.historyDB : { ...(prev || {}), ...parsed.historyDB });
          }
          setSyncNotice('🎉 成功恢复数据'); setSyncCodeInput('');
        } catch (err) { setSyncNotice('❌ 同步码解析失败'); }
      };

      const exportHistoryCSV = () => {
        triggerHaptic('light');
        const sortedDates = Object.keys(historyDB || {}).sort();
        if (sortedDates.length === 0) return alert('暂无历史打卡记录可导出！');
        const headers = ['日期', '当日体重(kg)', '基础消耗TDEE(kcal)', '饮食摄入(kcal)', '碳水(g)', '蛋白质(g)', '脂肪(g)', '运动消耗(kcal)', '真实热量缺口(kcal)'];
        const rows = sortedDates.map(d => {
          const rec = historyDB[d] || {}, w = Number(rec.weight || profile.weight) || 70, { tdee } = calcTdeeForWeight(w);
          const mList = Array.isArray(rec.meals) ? rec.meals : [], wList = Array.isArray(rec.workouts) ? rec.workouts : [];
          const intake = mList.reduce((s, i) => s + (Number(i?.cal) || 0), 0);
          const carb = mList.reduce((s, i) => s + (Number(i?.carb) || 0), 0).toFixed(1);
          const pro = mList.reduce((s, i) => s + (Number(i?.pro) || 0), 0).toFixed(1);
          const fat = mList.reduce((s, i) => s + (Number(i?.fat) || 0), 0).toFixed(1);
          const burned = wList.reduce((s, i) => s + (Number(i?.cal) || 0), 0);
          return [d, w, tdee, intake, carb, pro, fat, burned, tdee + burned - intake].join(',');
        });
        const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `膳食与运动历史报告_${todayStr}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const handleProviderChange = (newProvider) => {
        let defaultModel = 'glm-4v-flash';
        if (newProvider === 'gemini') defaultModel = 'gemini-2.0-flash';
        if (newProvider === 'openai') defaultModel = 'gpt-4o-mini';
        setAiConfig({ ...aiConfig, provider: newProvider, model: defaultModel });
      };

      const calProgressPct = Math.min(100, Math.round((totals.cal / effectiveTargetCal) * 100));
      const carbPct = Math.min(100, Math.round((totals.carb / Math.max(1, targets.carb)) * 100));
      const proPct = Math.min(100, Math.round((totals.pro / Math.max(1, targets.pro)) * 100));
      const fatPct = Math.min(100, Math.round((totals.fat / Math.max(1, targets.fat)) * 100));

            <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">

                  <span>{totals.carb}/{targets.carb}g</span>

                <div className="w-full h-1.5 bg-amber-200/60 rounded-full overflow-hidden">
                  <div style={{ width: `${carbPct}%` }} className="h-full bg-amber-500 rounded-full transition-all duration-300" />

              </div>
              <div className="bg-sky-50/70 border border-sky-100 px-3 py-2 rounded-2xl">
                <div className="flex justify-between text-xs font-bold text-sky-900 mb-1">
                  <span>蛋白质</span>
                  <span>{totals.pro}/{targets.pro}g</span>
                </div>
                <div className="w-full h-1.5 bg-sky-200/60 rounded-full overflow-hidden">
                  <div style={{ width: `${proPct}%` }} className="h-full bg-sky-500 rounded-full transition-all duration-300" />
                </div>
              </div>
              <div className="bg-rose-50/70 border border-rose-100 px-3 py-2 rounded-2xl">
                <div className="flex justify-between text-xs font-bold text-rose-900 mb-1">
                  <span>脂肪</span>
                  <span>{totals.fat}/{targets.fat}g</span>
                </div>
                <div className="w-full h-1.5 bg-rose-200/60 rounded-full overflow-hidden">
                  <div style={{ width: `${fatPct}%` }} className="h-full bg-rose-500 rounded-full transition-all duration-300" />
                </div>
              </div>
            </div>

            {/* 每日 3 颗星成就进度条 + 暖心鼓励语 */}
            <div className="pt-1 border-t border-slate-100 space-y-2">
              <div className="flex items-center justify-between text-xs">
                <span className="font-black text-slate-700 flex items-center gap-1">
                  <span>🎯 今日小目标 ({dailyQuests.doneCount}/3)</span>

                </span>
                <div className="flex items-center gap-1.5 text-[11px] font-bold">
                  <span className={dailyQuests.q1 ? 'text-emerald-600' : 'text-slate-300'}>{dailyQuests.q1 ? '★' : '☆'}体重</span>
                  <span className={dailyQuests.q2 ? 'text-emerald-600' : 'text-slate-300'}>{dailyQuests.q2 ? '★' : '☆'}记餐</span>
                  <span className={dailyQuests.q3 ? 'text-emerald-600' : 'text-slate-300'}>{dailyQuests.q3 ? '★' : '☆'}控卡/运动</span>
                </div>
              </div>

              <div
                onClick={() => { triggerHaptic('light'); fireConfetti(); setCheerQuote(CHEER_QUOTES[Math.floor(Math.random() * CHEER_QUOTES.length)]); }}
                className={`jelly-btn px-3 py-2 rounded-2xl border text-xs font-semibold flex items-center gap-2 cursor-pointer ${dynamicEncouragement.bg}`}
                title="点击放礼花鼓励自己一下！"
              >
                <span className="text-base shrink-0">{dynamicEncouragement.icon}</span>
                <span className="leading-snug flex-1">{dynamicEncouragement.text}</span>
              </div>
            </div>
          </div>

          {/* 3. 重要节点醒目提醒横幅 */}
          {smartAlerts.length > 0 && (
            <div className="space-y-2">
              {smartAlerts.map((al, i) => (
                <div
                  key={i}
                  className={`p-3.5 rounded-2xl border flex items-start justify-between gap-3 shadow-sm ${
                    al.type === 'danger'
                      ? 'bg-rose-600 text-white border-rose-700'
                      : al.type === 'warn'
                      ? 'bg-amber-50 text-amber-950 border-amber-300'
                      : 'bg-indigo-50 text-indigo-950 border-indigo-200'
                  }`}
                >
                  <div className="flex items-start gap-2.5">
                    <span className="text-lg leading-none mt-0.5">{al.icon}</span>
                    <div className="space-y-0.5">
                      <div className="text-sm font-black leading-snug">{al.title}</div>
                      <div className={`text-xs leading-relaxed ${al.type === 'danger' ? 'text-rose-100' : 'text-slate-600'}`}>{al.desc}</div>
                    </div>
                  </div>
                  {al.actionStep && currentStep !== al.actionStep && (
                    <button
                      type="button"
                      onClick={() => { triggerHaptic('medium'); setCurrentStep(al.actionStep); }}
                      className="jelly-btn bg-white text-rose-600 font-black text-xs px-3 py-2 rounded-xl shrink-0 shadow-sm"
                    >
                      {al.actionText}
                    </button>
                  )}
                </div>
              ))}

          )}

          {/* ==================== 第 1 页：身体档案与目标 ==================== */}
          {currentStep === 1 && (
            <div key="step-1" className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200/80 space-y-5 page-enter">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 className="text-base font-black text-slate-900">👤 当日体重与身体参数</h2>
                <span className="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">{selectedDate}</span>
              </div>

              <div className="bg-gradient-to-r from-indigo-600 to-indigo-700 text-white p-4 rounded-2xl flex items-center justify-between shadow-sm">
                <div>
                  <span className="text-xs text-indigo-200 font-bold block">📌 每日必打卡项 ({selectedDate})</span>
                  <span className="text-base font-black">当日空腹体重 (kg)</span>
                </div>
                <input
                  type="number"
                  step="0.1"
                  value={currentDayData.weight ?? profile.weight}
                  onChange={e => handleDayWeightChange(e.target.value)}
                  onBlur={() => showToast('⚖️ 今日体重已记录，继续加油！', 'light')}

              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1.5">性别</label>
                  <select value={profile.gender} onChange={e => setProfile({...profile, gender: e.target.value})} className="w-full rounded-xl border border-slate-200 px-3 py-2.5 bg-slate-50 font-semibold text-slate-800">
                    <option value="male">男</option><option value="female">女</option>

                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1.5">年龄</label>

                  <span className="text-xs text-slate-600 font-bold block">📉 每日体重变化折线 (kg)</span>
                  <div className="w-full overflow-hidden bg-slate-50 rounded-2xl border border-slate-100 p-1">
                    <svg viewBox="0 0 520 150" className="w-full h-36 select-none">
                      <line x1={32} y1={24} x2={488} y2={24} stroke="#e2e8f0" strokeDasharray="3 3" />
                      <line x1={32} y1={75} x2={488} y2={75} stroke="#e2e8f0" strokeDasharray="3 3" />
                      <line x1={32} y1={126} x2={488} y2={126} stroke="#cbd5e1" />
                      {weightPoints.length > 1 && <polyline fill="none" stroke="#4f46e5" strokeWidth="3" points={weightPoints.map(p => `${p.x},${p.y}`).join(' ')} />}
                      {weightPoints.map(p => {
                        const isSelected = p.date === selectedDate;
                        return (
                          <g key={p.date} onClick={() => { triggerHaptic('light'); setSelectedDate(p.date); }} className="cursor-pointer">
                            <circle cx={p.x} cy={p.y} r={isSelected ? 6.5 : 4.5} fill={isSelected ? '#4f46e5' : '#ffffff'} stroke="#4f46e5" strokeWidth={isSelected ? 3 : 2.5} />
                            <text x={p.x} y={p.y - 10} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#1e1b4b">{p.weight}</text>
                            <text x={p.x} y={144} textAnchor="middle" fontSize="10" fill="#64748b">{p.shortDate}</text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>
                </div>
              </div>

              <button type="button" onClick={exportHistoryCSV} className="jelly-btn w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl text-sm shadow">
                📥 导出全部打卡历史报表 (CSV)
              </button>
            </div>
          )}

          {/* ==================== 第 5 页：终极结算与完赛庆祝 ==================== */}
          {currentStep === 5 && (
            <div key="step-5" className="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 page-enter">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 className="text-base font-black text-slate-900">🏆 当日终极结算与明日规划</h2>
                <span className="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">{selectedDate}</span>
              </div>

              <div className="bg-gradient-to-br from-indigo-900 to-slate-900 text-white p-5 rounded-3xl space-y-4 shadow-md">
                <div className="flex justify-between items-center text-xs text-indigo-200 border-b border-indigo-800/80 pb-3">
                  <span>📅 结算日期：{selectedDate}</span>
                  <span className="bg-indigo-600 text-white px-3 py-1 rounded-full font-bold">体重 {activeWeight} kg</span>
                </div>
                <div className="grid grid-cols-2 gap-4 text-center">
                  <div>
                    <span className="text-xs text-indigo-300 block">日常代谢消耗 (TDEE)</span>
                    <span className="text-2xl font-black">{targets.tdee} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-l border-indigo-800/80">
                    <span className="text-xs text-emerald-400 block">运动额外消耗</span>
                    <span className="text-2xl font-black text-emerald-400">+{burnedCalories} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-t border-indigo-800/80 pt-3">
                    <span className="text-xs text-indigo-300 block">当日饮食总摄入</span>
                    <span className="text-2xl font-black">{totals.cal} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-t border-l border-indigo-800/80 pt-3">
                    <span className="text-xs text-indigo-200 block font-bold">当日净热量缺口</span>
                    <span className={`text-2xl font-black ${actualDeficit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {actualDeficit >= 0 ? `-${actualDeficit}` : `+${Math.abs(actualDeficit)}`} <small className="text-xs font-bold">kcal</small>
                    </span>
                    <span className="text-[11px] text-indigo-300 block mt-0.5">预计周变化：{actualDeficit >= 0 ? `-${weeklyWeightChangeKg}` : `+${Math.abs(weeklyWeightChangeKg)}`} kg/周</span>
                  </div>
                </div>
              </div>

              {/* 每日仪式感打卡庆祝按钮与专属鼓励签 */}
              <div className="bg-gradient-to-r from-amber-50 to-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl space-y-3 text-center">
                <div className="text-xs font-black text-emerald-800 uppercase tracking-wider">✨ 今日专属能量寄语 ✨</div>
                <p className="text-sm font-bold text-slate-800 leading-relaxed px-2">“{cheerQuote}”</p>
                <button
                  type="button"
                  onClick={handleCompleteDailyCheckIn}
                  className="jelly-btn w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black py-3 rounded-2xl text-sm shadow-md"
                >
                  {currentDayData.checkedIn ? '🎉 今日已完美打卡（点我再放一次礼花！）' : '🎉 完成今日健康打卡（点亮礼花与震动）'}
                </button>
              </div>

              <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-sm space-y-1.5">
                <div className="font-black text-slate-900">📌 系统智能诊断提醒：</div>
                <p className="text-slate-700 leading-relaxed">
                  {actualDeficit >= 300 ? `✅ 太棒了！当日创造了 ${actualDeficit} kcal 的黄金减脂缺口，今晚请安心睡个好觉。` : actualDeficit >= 0 ? `⚖️ 当日热量基本收支平衡（微缺口 ${actualDeficit} kcal），身体毫无负担，明天继续保持。` : `💖 当日热量盈余 ${Math.abs(actualDeficit)} kcal。偶尔享受美食完全没问题，今晚或明天散步30分钟、多喝温水排钠即可！`}
                  {totals.pro < targets.pro * 0.8 ? ` 另外当日蛋白质还差 ${(targets.pro - totals.pro).toFixed(0)}g，次日早餐建议加上两颗鸡蛋或无糖豆浆，守住肌肉不掉代谢！` : ''}
                </p>
              </div>

              <div className="border-t border-slate-100 pt-3 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-sm font-black text-slate-900">🤖 AI 营养师明日三餐定制</span>
                  <button
                    type="button"
                    onClick={handleGetAiAdvice}
                    disabled={aiAdviceLoading}
                    className="jelly-btn bg-indigo-600 disabled:bg-indigo-400 text-white font-black px-4 py-2.5 rounded-2xl text-xs shadow-sm"
                  >
                    {aiAdviceLoading ? '⏳ 正在生成...' : '✨ 生成 AI 明日规划'}
                  </button>
                </div>
                {aiAdvice && (
                  <div className="bg-indigo-50/70 border border-indigo-200 p-4 rounded-2xl text-sm text-slate-800 leading-relaxed whitespace-pre-line page-enter">
                    {aiAdvice}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 4. 手机端底部固定毛玻璃导航栏 */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200/90 z-50 bottom-nav-safe shadow-lg">
            <div className="max-w-lg mx-auto grid grid-cols-5 px-2 py-1.5">
              {[
                { idx: 1, icon: '👤', label: '档案' },
                { idx: 2, icon: '📷', label: '记饮食' },
                { idx: 3, icon: '🚴', label: '去运动' },
                { idx: 4, icon: '📈', label: '看趋势' },
                { idx: 5, icon: '🏆', label: '总结算' }
              ].map(tab => {
                const active = currentStep === tab.idx;
                const showBadge = (tab.idx === 3 && calDiff < 0);
                return (
                  <button
                    key={tab.idx}
                    type="button"
                    onClick={() => {
                      triggerHaptic('light');
                      setCurrentStep(tab.idx);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className={`jelly-btn relative flex flex-col items-center justify-center py-1.5 rounded-2xl ${
                      active ? 'text-indigo-600 font-black' : 'text-slate-400 font-medium'
                    }`}
                  >
                    {showBadge && (
                      <span className="absolute top-1 right-4 w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping" />
                    )}
                    <span className={`text-xl leading-none mb-1 transition-transform ${active ? 'scale-110' : ''}`}>{tab.icon}</span>
                    <span className="text-xs tracking-tight">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><MacroTrackerApp /></ErrorBoundary>);
  </script>
</body>
</html>

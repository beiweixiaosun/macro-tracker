    // 安全读取 LocalStorage，防止旧缓存损坏导致白屏
    const safeGetStorage = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const getLocalDateStr = (dateObj = new Date()) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const shiftDateStr = (dateStr, days) => {
      if (!dateStr || typeof dateStr !== 'string') return getLocalDateStr();
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return getLocalDateStr();
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      dt.setDate(dt.getDate() + days);
      return getLocalDateStr(dt);
    };

    const compressImageFile = (file, maxWidth = 800, quality = 0.8) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64Data = dataUrl.split(',')[1];
            resolve({ dataUrl, base64Data, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    // React 错误边界组件：万一发生异常，提供一键恢复按钮，绝不白屏
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: error?.message || '未知渲染错误' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="max-w-md mx-auto mt-12 p-6 bg-white rounded-2xl shadow border border-rose-200 text-center space-y-4">
              <div className="text-base font-bold text-rose-600">⚠️ 页面渲染遇到了一点小问题</div>
              <p className="text-xs text-slate-500">可能是浏览器自动翻译插件冲突或旧缓存数据格式不兼容：{this.state.errorMsg}</p>
              <div className="flex justify-center gap-2">
                <button
                  onClick={() => this.setState({ hasError: false })}
                  className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl"
                >
                  重试加载
                </button>
                <button
                  onClick={() => { localStorage.clear(); window.location.reload(); }}
                  className="bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold px-4 py-2 rounded-xl"
                >
                  重置本地缓存并刷新
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function MacroTrackerApp() {
      const todayStr = getLocalDateStr();
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [trendRange, setTrendRange] = useState(7);

      // 5步卡片切换状态: 1:👤状态 2:📷膳食 3:🚴运动 4:📈趋势 5:🏆结算
      const [currentStep, setCurrentStep] = useState(1);
      const [showSystemSettings, setShowSystemSettings] = useState(false);

      const [importMode, setImportMode] = useState('merge');
      const [syncCodeInput, setSyncCodeInput] = useState('');
      const [syncNotice, setSyncNotice] = useState('');

      const [aiConfig, setAiConfig] = useState(() =>
        safeGetStorage('macro_ai_config_v7', { provider: 'gemini', apiKey: '' })
      );
      const [aiLoading, setAiLoading] = useState(false);
      const [aiPreviewUrl, setAiPreviewUrl] = useState('');
      const [aiDetectedFoods, setAiDetectedFoods] = useState([]);
      const [aiError, setAiError] = useState('');
      const cameraInputRef = useRef(null);

      const [aiAdvice, setAiAdvice] = useState('');
      const [aiAdviceLoading, setAiAdviceLoading] = useState(false);

      const [profile, setProfile] = useState(() => {
        const saved = safeGetStorage('macro_profile_v4', null);
        return {
          gender: saved?.gender || 'male',
          age: Number(saved?.age) || 26,
          height: Number(saved?.height) || 175,
          weight: Number(saved?.weight) || 70,
          activity: Number(saved?.activity) || 1.375,
          goal: GOAL_CONFIGS[saved?.goal] ? saved.goal : 'cut'
        };
      });

      const [historyDB, setHistoryDB] = useState(() => {
        const saved = safeGetStorage('macro_history_v5', null);
        if (saved && typeof saved === 'object') return saved;

        const oldMeals = safeGetStorage('macro_meals_v4', []);
        const oldWorkouts = safeGetStorage('macro_workouts_v4', []);
        const oldProf = safeGetStorage('macro_profile_v4', { weight: 70 });

        if (Array.isArray(oldMeals) && oldMeals.length > 0) {
          return {
            [todayStr]: {
              weight: Number(oldProf?.weight) || 70,
              meals: oldMeals,
              workouts: Array.isArray(oldWorkouts) ? oldWorkouts : []
            }
          };
        }
        return {};
      });

      const [activeCategory, setActiveCategory] = useState('全部');
      const [searchQuery, setSearchQuery] = useState('');
      const [multiplier, setMultiplier] = useState(1);
      const [customFood, setCustomFood] = useState({ name: '', carb: '', pro: '', fat: '' });

      const [exFilter, setExFilter] = useState('全部');
      const [offsetMode, setOffsetMode] = useState('smart');
      const [logDuration, setLogDuration] = useState(30);

      useEffect(() => {
        try { localStorage.setItem('macro_profile_v4', JSON.stringify(profile)); } catch (e) {}
      }, [profile]);

      useEffect(() => {
        try { localStorage.setItem('macro_history_v5', JSON.stringify(historyDB)); } catch (e) {}
      }, [historyDB]);

      useEffect(() => {
        try { localStorage.setItem('macro_ai_config_v7', JSON.stringify(aiConfig)); } catch (e) {}
      }, [aiConfig]);

      const currentDayData = (historyDB && historyDB[selectedDate]) ? historyDB[selectedDate] : {
        weight: profile.weight,
        meals: [],
        workouts: []
      };

      const meals = Array.isArray(currentDayData.meals) ? currentDayData.meals : [];
      const workouts = Array.isArray(currentDayData.workouts) ? currentDayData.workouts : [];
      const activeWeight = Number(currentDayData.weight ?? profile.weight) || 70;

      const updateDayRecord = (updater) => {
        setHistoryDB(prev => {
          const safePrev = prev && typeof prev === 'object' ? prev : {};
          const existing = safePrev[selectedDate] || { weight: profile.weight, meals: [], workouts: [] };
          const updated = updater({
            weight: existing.weight ?? profile.weight,
            meals: Array.isArray(existing.meals) ? existing.meals : [],
            workouts: Array.isArray(existing.workouts) ? existing.workouts : []
          });
          return { ...safePrev, [selectedDate]: updated };
        });
      };

      const handleDayWeightChange = (val) => {
        if (selectedDate === todayStr) {
          setProfile(p => ({ ...p, weight: val }));
        }
        updateDayRecord(rec => ({ ...rec, weight: val }));
      };

      const calcTdeeForWeight = (w) => {
        const { gender, age, height, activity } = profile;
        let bmr = (10 * (Number(w) || 70)) + (6.25 * (Number(height) || 175)) - (5 * (Number(age) || 26));
        bmr += gender === 'male' ? 5 : -161;
        const act = Number(activity) || 1.375;
        return {
          bmr: Math.max(800, Math.round(bmr)),
          tdee: Math.max(1000, Math.round(bmr * act))
        };
      };

      const targets = useMemo(() => {
        const { bmr, tdee } = calcTdeeForWeight(activeWeight);
        const cfg = GOAL_CONFIGS[profile.goal] || GOAL_CONFIGS.cut;
        const cal = Math.max(800, Math.round(tdee * cfg.calMulti));

        return {
          bmr,
          tdee,
          cal,
          plannedDeficit: Math.round(tdee - cal),
          carb: Math.round((cal * cfg.carbRatio) / 4),
          pro: Math.round((cal * cfg.proRatio) / 4),
          fat: Math.round((cal * cfg.fatRatio) / 9)
        };
      }, [profile, activeWeight]);

      const totals = useMemo(() => {
        return meals.reduce((acc, item) => ({
          carb: +(acc.carb + (Number(item?.carb) || 0)).toFixed(1),
          pro: +(acc.pro + (Number(item?.pro) || 0)).toFixed(1),
          fat: +(acc.fat + (Number(item?.fat) || 0)).toFixed(1),
          cal: Math.round(acc.cal + (Number(item?.cal) || 0))
        }), { carb: 0, pro: 0, fat: 0, cal: 0 });
      }, [meals]);

      const burnedCalories = useMemo(() => {
        return workouts.reduce((sum, w) => sum + (Number(w?.cal) || 0), 0);
      }, [workouts]);

      const effectiveTargetCal = Math.max(800, targets.cal + burnedCalories);
      const calDiff = effectiveTargetCal - totals.cal;
      const actualDeficit = (targets.tdee + burnedCalories) - totals.cal;
      const weeklyWeightChangeKg = ((actualDeficit * 7) / 7700).toFixed(2);

      const trendSeries = useMemo(() => {
        const days = [];
        let lastKnownWeight = Number(profile.weight) || 70;

        for (let i = trendRange - 1; i >= 0; i--) {
          const dStr = shiftDateStr(selectedDate, -i);
          const rec = historyDB ? historyDB[dStr] : null;
          const mArr = Array.isArray(rec?.meals) ? rec.meals : [];
          const wArr = Array.isArray(rec?.workouts) ? rec.workouts : [];
          const hasMealsOrWorkouts = mArr.length > 0 || wArr.length > 0;
          const hasWeight = rec && rec.weight !== undefined && rec.weight !== '' && !isNaN(Number(rec.weight));

          if (hasWeight) {
            lastKnownWeight = Number(rec.weight);
          }

          const dayWeight = hasWeight ? Number(rec.weight) : lastKnownWeight;
          const { tdee } = calcTdeeForWeight(dayWeight);
          const intake = mArr.reduce((s, m) => s + (Number(m?.cal) || 0), 0);
          const burned = wArr.reduce((s, w) => s + (Number(w?.cal) || 0), 0);
          const deficit = hasMealsOrWorkouts ? (tdee + burned - intake) : null;

          days.push({
            date: dStr,
            shortDate: dStr.slice(5),
            weight: dayWeight,
            hasWeight,
            hasMealsOrWorkouts,
            intake,
            burned,
            tdee,
            deficit
          });
        }
        return days;
      }, [historyDB, selectedDate, trendRange, profile]);

      const trendSummary = useMemo(() => {
        const activeDays = trendSeries.filter(d => d.deficit !== null);
        const totalDeficit = activeDays.reduce((s, d) => s + d.deficit, 0);
        const estFatLossKg = (totalDeficit / 7700).toFixed(2);

        const weights = trendSeries.map(d => d.weight);
        const firstW = weights[0] || activeWeight;
        const lastW = weights[weights.length - 1] || activeWeight;
        const weightDiff = +(lastW - firstW).toFixed(2);

        return {
          recordedCount: activeDays.length,
          totalDeficit,
          estFatLossKg,
          weightDiff
        };
      }, [trendSeries, activeWeight]);

      const maxAbsDeficit = useMemo(() => {
        return Math.max(600, ...trendSeries.map(d => (d.deficit !== null ? Math.abs(d.deficit) : 0)));
      }, [trendSeries]);

      const weightPoints = useMemo(() => {
        if (!trendSeries || trendSeries.length === 0) return [];
        const wArr = trendSeries.map(d => Number(d.weight) || 70);
        const minW = Math.min(...wArr) - 0.8;
        const maxW = Math.max(...wArr) + 0.8;
        const wSpan = Math.max(1.5, maxW - minW);
        const padX = 28, padY = 22, innerW = 520 - 56, innerH = 140 - 44;

        return trendSeries.map((d, idx) => {
          const x = padX + (trendSeries.length === 1 ? innerW / 2 : (idx / (trendSeries.length - 1)) * innerW);
          const y = padY + innerH - (((Number(d.weight) || 70) - minW) / wSpan) * innerH;
          return { x: Math.round(x), y: Math.round(y), ...d };
        });
      }, [trendSeries]);

      const targetBurnCal = useMemo(() => {
        if (offsetMode === 'all') return Math.max(100, totals.cal);
        if (offsetMode === 'd300') return 300;
        if (offsetMode === 'd500') return 500;
        return calDiff < 0 ? Math.abs(calDiff) : 400;
      }, [offsetMode, totals.cal, calDiff]);

      const filteredDB = useMemo(() => {
        const q = (searchQuery || '').toLowerCase();
        return ASIAN_FOOD_DB.filter(item => {
          const matchCat = activeCategory === '全部' || item.category === activeCategory;
          const matchQuery = item.name.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
          return matchCat && matchQuery;
        });
      }, [activeCategory, searchQuery]);

      const filteredExercises = useMemo(() => {
        return EXERCISE_DB.filter(ex => exFilter === '全部' || ex.type === exFilter);
      }, [exFilter]);

      const addFromDB = (food) => {
        const m = Number(multiplier) || 1;
        const carb = +(food.carb * m).toFixed(1);
        const pro = +(food.pro * m).toFixed(1);
        const fat = +(food.fat * m).toFixed(1);
        const cal = Math.round(carb * 4 + pro * 4 + fat * 9);
        const label = m === 1 ? food.name : `${food.name} (${m}x)`;

        updateDayRecord(rec => ({
          ...rec,
          meals: [{ id: Date.now() + Math.random(), name: label, carb, pro, fat, cal }, ...rec.meals]
        }));
      };

      const handleCustomAdd = (e) => {
        e.preventDefault();
        const carb = Math.max(0, parseFloat(customFood.carb) || 0);
        const pro = Math.max(0, parseFloat(customFood.pro) || 0);
        const fat = Math.max(0, parseFloat(customFood.fat) || 0);
        if (carb === 0 && pro === 0 && fat === 0) return;

        const cal = Math.round(carb * 4 + pro * 4 + fat * 9);
        updateDayRecord(rec => ({
          ...rec,
          meals: [{
            id: Date.now(),
            name: (customFood.name || '').trim() || '自定义餐品',
            carb, pro, fat, cal
          }, ...rec.meals]
        }));

        setCustomFood({ name: '', carb: '', pro: '', fat: '' });
      };

      const logExercise = (ex, customMinutes) => {
        const mins = Math.max(1, Number(customMinutes) || Number(logDuration) || 30);
        const calPerMin = (ex.met * 3.5 * activeWeight) / 200;
        const burned = Math.round(calPerMin * mins);

        updateDayRecord(rec => ({
          ...rec,
          workouts: [
            { id: Date.now() + Math.random(), name: ex.name, type: ex.type, mins, cal: burned },
            ...rec.workouts
          ]
        }));
      };

      const handlePhotoCapture = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = '';

        if (!aiConfig.apiKey || !aiConfig.apiKey.trim()) {
          setShowSystemSettings(true);
          alert('⚠️ 请先在右上角展开的设置面板中填入你的 Gemini 或 OpenAI API Key。');
          return;
        }

        setAiError('');
        setAiLoading(true);
        setAiDetectedFoods([]);

        try {
          const { dataUrl, base64Data, mimeType } = await compressImageFile(file);
          setAiPreviewUrl(dataUrl);

          const promptText = `你是一位精通中国菜（尤其是川菜、巴蜀小吃）与亚洲美食的专业营养师。
请仔细识别这张图片中的食物或食品成分表，估算其可食部重量，并严格只返回如下格式的纯 JSON 对象（不要 markdown 代码块包裹，不要其他文字）：
{"foods":[{"name":"食物中文名称(含估算克数或份量)","carb":碳水克数数字,"pro":蛋白质克数数字,"fat":脂肪克数数字,"note":"简短估算依据"}]}`;

          let rawResultText = '';

          if (aiConfig.provider === 'gemini') {
            const resp = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${aiConfig.apiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [
                      { text: promptText },
                      { inline_data: { mime_type: mimeType, data: base64Data } }
                    ]
                  }],
                  generationConfig: { responseMimeType: 'application/json' }
                })
              }
            );
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'Gemini API 请求失败');
            rawResultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else {
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConfig.apiKey.trim()}`
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                response_format: { type: 'json_object' },
                messages: [{
                  role: 'user',
                  content: [
                    { type: 'text', text: promptText },
                    { type: 'image_url', image_url: { url: dataUrl } }
                  ]
                }]
              })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'OpenAI API 失败');
            rawResultText = data.choices?.[0]?.message?.content || '';
          }

          const parsed = JSON.parse(rawResultText.replace(/```json|```/g, '').trim());
          const list = parsed.foods || [];
          if (list.length === 0) {
            setAiError('未识别出明确食物，请换个角度重试。');
          } else {
            setAiDetectedFoods(
              list.map((f, i) => {
                const carb = +(Number(f.carb) || 0).toFixed(1);
                const pro = +(Number(f.pro) || 0).toFixed(1);
                const fat = +(Number(f.fat) || 0).toFixed(1);
                return {
                  id: Date.now() + i,
                  name: f.name || 'AI识别餐品',
                  carb, pro, fat,
                  cal: Math.round(carb * 4 + pro * 4 + fat * 9),
                  note: f.note || ''
                };
              })
            );
          }
        } catch (err) {
          setAiError(`❌ 识别出错：${err.message}`);
        } finally {
          setAiLoading(false);
        }
      };

      const confirmAddAiFood = (item) => {
        updateDayRecord(rec => ({
          ...rec,
          meals: [
            { id: Date.now() + Math.random(), name: `📷 ${item.name}`, carb: item.carb, pro: item.pro, fat: item.fat, cal: item.cal },
            ...rec.meals
          ]
        }));
        setAiDetectedFoods(prev => prev.filter(f => f.id !== item.id));
      };

      const handleGetAiAdvice = async () => {
        if (!aiConfig.apiKey || !aiConfig.apiKey.trim()) {
          setShowSystemSettings(true);
          alert('请先在顶部设置面板中配置 API Key！');
          return;
        }
        setAiAdviceLoading(true);
        setAiAdvice('');

        try {
          const mealsSummary = meals.map(m => `🍜 ${m.name} (碳水 ${m.carb}g, 蛋白 ${m.pro}g, 脂肪 ${m.fat}g, 热量 ${m.cal}kcal)`).join('\n');
          const workoutSummary = workouts.map(w => `🚴 ${w.name} (${w.mins}分钟, 消耗 ${w.cal}kcal)`).join('\n');
          const genderCn = profile.gender === 'male' ? '男' : '女';

          const advicePrompt = `你是资深运动营养师和健康管理AI教练。请根据这位用户的今日身体、饮食和运动打卡数据，生成一份【简洁、直爽、有温情】的今日总结、点评及【明天的实操规划】。

【用户基础档案】：
- 性别：${genderCn}，年龄：${profile.age}岁，身高：${profile.height}cm
- 当前体重：${activeWeight} kg
- 阶段目标：${(GOAL_CONFIGS[profile.goal] || GOAL_CONFIGS.cut).label}
- 基础 BMR：${targets.bmr} kcal，日常 TDEE：${targets.tdee} kcal
- 理想每日摄入目标：${targets.cal} kcal，当前真实累计摄入：${totals.cal} kcal

【今日饮食记录】：
${mealsSummary || '无摄入记录'}
【今日运动打卡】：
${workoutSummary || '无运动记录'}
【今日真实热量缺口】：${actualDeficit} kcal (正数为缺口，负数为盈余，预计每周体重变化 ${weeklyWeightChangeKg} kg/周)

请在 300 字以内返回，包含：
1. 💡 今日能量与三大营养素配比点评。
2. 🎯 明天具体的三餐调整建议。
3. 🚴‍♀️ 明天运动、饮水或休息的具体行动安排。`;

          let resultAdvice = '';
          if (aiConfig.provider === 'gemini') {
            const resp = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${aiConfig.apiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: advicePrompt }] }]
                })
              }
            );
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'Gemini 请求失败');
            resultAdvice = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else {
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConfig.apiKey.trim()}`
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: advicePrompt }]
              })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'OpenAI 请求失败');
            resultAdvice = data.choices?.[0]?.message?.content || '';
          }

          setAiAdvice(resultAdvice);
        } catch (err) {
          setAiAdvice(`❌ AI点评生成失败：${err.message}`);
        } finally {
          setAiAdviceLoading(false);
        }
      };

      const buildBackupPayload = () => ({
        version: 'v8.1', exportedAt: new Date().toISOString(), profile, aiConfig, historyDB
      });

      const downloadJsonBackup = () => {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `macro_tracker_backup_${todayStr}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setSyncNotice('✅ 备份下载成功！');
      };

      const copySyncString = async () => {
        try {
          const payload = buildBackupPayload();
          const encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
          await navigator.clipboard.writeText(encoded);
          setSyncNotice('✅ 同步码已复制到剪贴板！');
        } catch (err) {
          setSyncNotice('❌ 复制失败');
        }
      };

      const applyImportedPayload = (parsed) => {
        if (!parsed || typeof parsed !== 'object' || (!parsed.historyDB && !parsed.profile)) {
          throw new Error('无效数据');
        }
        if (parsed.profile) setProfile(prev => ({ ...prev, ...parsed.profile }));
        if (parsed.aiConfig?.apiKey) setAiConfig(parsed.aiConfig);
        if (parsed.historyDB) {
          if (importMode === 'overwrite') {
            setHistoryDB(parsed.historyDB);
          } else {
            setHistoryDB(prev => {
              const merged = { ...(prev || {}) };
              Object.entries(parsed.historyDB).forEach(([k, day]) => {
                if (!merged[k]) { merged[k] = day; }
                else {
                  const mId = new Set((merged[k].meals || []).map(m => m.id));
                  const mergedM = [...(merged[k].meals || []), ...(day.meals || []).filter(x => !mId.has(x.id))];
                  const wId = new Set((merged[k].workouts || []).map(x => x.id));
                  const mergedW = [...(merged[k].workouts || []), ...(day.workouts || []).filter(x => !wId.has(x.id))];
                  merged[k] = { weight: day.weight ?? merged[k].weight, meals: mergedM, workouts: mergedW };
                }
              });
              return merged;
            });
          }
        }
        setSyncNotice('🎉 成功恢复数据');
        setSyncCodeInput('');
      };

      const handleSyncCodeRestore = () => {
        const raw = syncCodeInput.trim();
        if (!raw) return;
        try {
          const parsed = raw.startsWith('{') ? JSON.parse(raw) : JSON.parse(decodeURIComponent(atob(raw)));
          applyImportedPayload(parsed);
        } catch (err) {
          setSyncNotice('❌ 同步码解析失败，请检查是否复制完整');
        }
      };

      const exportHistoryCSV = () => {
        const sortedDates = Object.keys(historyDB || {}).sort();
        if (sortedDates.length === 0) {
          alert('暂无历史打卡记录可导出！');
          return;
        }
        const headers = ['日期', '当日体重(kg)', '基础消耗TDEE(kcal)', '饮食摄入(kcal)', '碳水(g)', '蛋白质(g)', '脂肪(g)', '运动消耗(kcal)', '真实热量缺口(kcal)'];
        const rows = sortedDates.map(d => {
          const rec = historyDB[d] || {};
          const w = Number(rec.weight || profile.weight) || 70;
          const { tdee } = calcTdeeForWeight(w);
          const mList = Array.isArray(rec.meals) ? rec.meals : [];
          const wList = Array.isArray(rec.workouts) ? rec.workouts : [];
          const intake = mList.reduce((s, i) => s + (Number(i?.cal) || 0), 0);
          const carb = mList.reduce((s, i) => s + (Number(i?.carb) || 0), 0).toFixed(1);
          const pro = mList.reduce((s, i) => s + (Number(i?.pro) || 0), 0).toFixed(1);
          const fat = mList.reduce((s, i) => s + (Number(i?.fat) || 0), 0).toFixed(1);
          const burned = wList.reduce((s, i) => s + (Number(i?.cal) || 0), 0);
          const deficit = tdee + burned - intake;
          return [d, w, tdee, intake, carb, pro, fat, burned, deficit].join(',');
        });
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `膳食与运动历史报告_${todayStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="max-w-xl mx-auto px-4 py-4 md:py-8 space-y-4">
          {/* Top Bar */}
          <header className="flex items-center justify-between pb-2 border-b border-slate-200">
            <h1 className="text-base sm:text-lg font-black text-slate-800 tracking-tight flex items-center gap-1.5">
              <span>🥗 膳食与运动追踪</span>
              <span className="text-[10px] font-semibold bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded border border-indigo-200">v8.1 稳定版</span>
            </h1>
            <div className="flex items-center gap-1">
              <button
                type="button"
                onClick={() => setSelectedDate(shiftDateStr(selectedDate, -1))}
                className="px-1.5 py-1 text-slate-500 hover:bg-slate-100 rounded text-xs font-semibold"
              >
                ◀
              </button>
              <input
                type="date"
                value={selectedDate}
                onChange={e => e.target.value && setSelectedDate(e.target.value)}
                className="text-xs font-bold bg-indigo-50/70 border border-indigo-200 text-indigo-700 rounded px-1.5 py-1 w-[112px]"
              />
              <button
                type="button"
                onClick={() => setSelectedDate(shiftDateStr(selectedDate, 1))}
                className="px-1.5 py-1 text-slate-500 hover:bg-slate-100 rounded text-xs font-semibold"
              >
                ▶
              </button>
              <button
                type="button"
                onClick={() => setShowSystemSettings(!showSystemSettings)}
                className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 ml-1 border border-slate-200 shadow-sm text-xs"
                title="系统设置与跨设备同步"
              >
                ⚙️
              </button>
            </div>
          </header>

          {/* 折叠：系统管理与备份区 */}
          {showSystemSettings && (
            <div className="bg-slate-900 text-white p-4 rounded-xl border border-slate-800 space-y-4 text-xs">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                <span className="font-bold">☁️ 跨设备同步 & AI 密钥设置</span>
                <button type="button" onClick={() => setShowSystemSettings(false)} className="text-slate-400">✕ 关闭</button>
              </div>

              <div className="space-y-2">
                <label className="block text-slate-400 font-semibold">AI 视觉模型与 API Key（仅保存在当前设备本地）</label>
                <div className="flex gap-1.5">
                  <select
                    value={aiConfig.provider}
                    onChange={e => setAiConfig({ ...aiConfig, provider: e.target.value })}
                    className="rounded bg-slate-800 border border-slate-700 px-2.5 py-1.5 text-white"
                  >
                    <option value="gemini">Gemini (免费额度)</option>
                    <option value="openai">OpenAI (gpt-4o-mini)</option>
                  </select>
                  <input
                    type="password"
                    placeholder="粘贴 AIzaSy... 或 sk-..."
                    value={aiConfig.apiKey}
                    onChange={e => setAiConfig({ ...aiConfig, apiKey: e.target.value })}
                    className="flex-1 rounded bg-slate-800 border border-slate-700 px-2.5 py-1.5 text-white"
                  />
                </div>
              </div>

              <div className="space-y-2 border-t border-slate-800/80 pt-2.5">
                <span className="text-slate-400 block font-semibold">设备间同步 / 备份</span>
                {syncNotice && <div className="text-amber-300 font-medium">{syncNotice}</div>}
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={copySyncString} className="bg-indigo-700 hover:bg-indigo-600 px-2 py-2 rounded font-bold">📋 复制同步码</button>

                          <span className={`text-[9px] mt-1 ${isSelected ? 'font-bold text-indigo-700 underline' : 'text-slate-500'}`}>{d.shortDate}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="space-y-1">
                  <span className="text-xs text-slate-600 font-semibold block">每日体重趋势折线 (kg)</span>
                  <div className="w-full overflow-hidden bg-slate-50/60 rounded-xl border border-slate-100">
                    <svg viewBox="0 0 520 140" className="w-full h-32 select-none">
                      <line x1={28} y1={22} x2={492} y2={22} stroke="#e2e8f0" strokeDasharray="3 3" />
                      <line x1={28} y1={70} x2={492} y2={70} stroke="#e2e8f0" strokeDasharray="3 3" />
                      <line x1={28} y1={118} x2={492} y2={118} stroke="#cbd5e1" />
                      {weightPoints.length > 1 && (
                        <polyline fill="none" stroke="#4f46e5" strokeWidth="2.5" points={weightPoints.map(p => `${p.x},${p.y}`).join(' ')} />
                      )}
                      {weightPoints.map(p => {
                        const isSelected = p.date === selectedDate;
                        return (
                          <g key={p.date} onClick={() => setSelectedDate(p.date)} className="cursor-pointer">
                            <circle cx={p.x} cy={p.y} r={isSelected ? 6 : 4} fill={isSelected ? '#4f46e5' : '#ffffff'} stroke="#4f46e5" strokeWidth={isSelected ? 3 : 2} />
                            <text x={p.x} y={p.y - 9} textAnchor="middle" fontSize="10" fontWeight={isSelected ? 'bold' : 'normal'} fill="#312e81">{p.weight}</text>
                            <text x={p.x} y={135} textAnchor="middle" fontSize="9" fill="#64748b">{p.shortDate}</text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>
                </div>
              </div>

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={exportHistoryCSV}
                  className="flex-1 bg-slate-900 text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-slate-800"
                >
                  📥 导出 CSV 报表
                </button>
                <button
                  type="button"
                  onClick={() => setCurrentStep(5)}
                  className="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-indigo-700"
                >
                  下一步：🏆 今日终极结算 ▶
                </button>
              </div>
            </div>
          )}

          {/* 第 5 页：终极结算与 AI 明日规划 */}
          {currentStep === 5 && (
            <div key="step-5" className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2.5">
                <h2 className="text-base font-black text-slate-800">🏆 第 5 步：当日终极结算与规划</h2>
                <span className="text-xs text-indigo-600 font-semibold">{selectedDate}</span>
              </div>

              <div className="bg-gradient-to-br from-indigo-900 to-slate-900 text-white p-5 rounded-2xl space-y-4 shadow-md">
                <div className="flex justify-between items-center text-xs text-indigo-200 border-b border-indigo-800/80 pb-3">
                  <span>📅 结算日: {selectedDate}</span>
                  <span className="bg-indigo-500 text-white px-2.5 py-0.5 rounded-full font-bold">当日体重 {activeWeight} kg</span>
                </div>

                <div className="grid grid-cols-2 gap-4 text-center">
                  <div>
                    <span className="text-[11px] text-indigo-300 block">日常代谢总消耗 (TDEE)</span>
                    <span className="text-xl font-bold">{targets.tdee} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-l border-indigo-800/80">
                    <span className="text-[11px] text-emerald-400 block">运动额外抵消</span>
                    <span className="text-xl font-bold text-emerald-400">+{burnedCalories} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-t border-indigo-800/80 pt-3">
                    <span className="text-[11px] text-indigo-300 block">今日饮食总摄入</span>
                    <span className="text-xl font-bold">{totals.cal} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-t border-l border-indigo-800/80 pt-3">
                    <span className="text-[11px] text-indigo-200 block font-bold">最终造成热量缺口</span>
                    <span className={`text-xl font-black ${actualDeficit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {actualDeficit >= 0 ? `-${actualDeficit}` : `+${Math.abs(actualDeficit)}`} <small className="text-xs font-bold">kcal</small>
                    </span>
                    <span className="text-[10px] text-indigo-300 block mt-0.5">预计周变化：{actualDeficit >= 0 ? `-${weeklyWeightChangeKg}` : `+${Math.abs(weeklyWeightChangeKg)}`} kg/周</span>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2 border-t border-indigo-800/60 pt-3.5 text-center text-xs">
                  <div className="bg-indigo-950/60 p-2 rounded-lg">
                    <span className="text-amber-400 block font-bold">碳水化合物</span>
                    <span className="text-sm font-bold block mt-0.5">{totals.carb} / {targets.carb}g</span>
                  </div>
                  <div className="bg-indigo-950/60 p-2 rounded-lg">
                    <span className="text-sky-400 block font-bold">蛋白质</span>
                    <span className="text-sm font-bold block mt-0.5">{totals.pro} / {targets.pro}g</span>
                  </div>
                  <div className="bg-indigo-950/60 p-2 rounded-lg">
                    <span className="text-rose-400 block font-bold">脂肪</span>
                    <span className="text-sm font-bold block mt-0.5">{totals.fat} / {targets.fat}g</span>
                  </div>
                </div>
              </div>

              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs space-y-1.5">
                <div className="font-bold text-slate-800">📌 系统自动复盘与明日建议：</div>
                <p className="text-slate-600 leading-relaxed">
                  {actualDeficit >= 300
                    ? `✅ 今日创造了 ${actualDeficit} kcal 的理想减脂缺口！`
                    : actualDeficit >= 0
                    ? `⚖️ 今日热量基本收支平衡（微缺口 ${actualDeficit} kcal），若想加快减脂，明日可增加 30 分钟坡度走或慢跑。`
                    : `⚠️ 今日热量盈余 ${Math.abs(actualDeficit)} kcal，建议今晚或明天安排 40 分钟有氧+力量训练抵消，明日主食减半并多喝无糖茶水排钠。`}
                  {totals.pro < targets.pro * 0.8 ? ` 另外今日蛋白质摄入偏低（差 ${(targets.pro - totals.pro).toFixed(0)}g），明天建议补充即食鸡胸肉、温泉蛋或无糖豆浆以防掉肌肉。` : ''}
                </p>
              </div>

              <div className="border-t border-slate-100 pt-3.5 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-800">🤖 AI 营养师深度复盘与明日三餐/运动安排</span>
                  <button
                    type="button"
                    onClick={handleGetAiAdvice}
                    disabled={aiAdviceLoading}
                    className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-bold px-3 py-1.5 rounded-lg text-xs"
                  >
                    {aiAdviceLoading ? '⏳ 正在生成规划...' : '✨ 生成 AI 明日规划'}
                  </button>
                </div>

                {aiAdvice && (
                  <div className="bg-indigo-50/60 border border-indigo-200 p-4 rounded-xl text-xs text-slate-700 leading-relaxed whitespace-pre-line">
                    {aiAdvice}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 底部快速翻页 */}
          <div className="flex items-center justify-between pt-2 text-xs">
            <button
              type="button"
              onClick={() => setCurrentStep(prev => Math.max(1, prev - 1))}
              disabled={currentStep === 1}
              className="text-slate-600 disabled:opacity-30 border border-slate-200 rounded-xl px-4 py-2 bg-white font-medium"
            >
              ◀ 上一页
            </button>
            <span className="text-slate-400 font-semibold">第 {currentStep} / 5 页</span>
            <button
              type="button"
              onClick={() => setCurrentStep(prev => Math.min(5, prev + 1))}
              disabled={currentStep === 5}
              className="bg-slate-900 text-white disabled:opacity-30 font-bold rounded-xl px-4 py-2"
            >
              下一页 ▶
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <MacroTrackerApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>

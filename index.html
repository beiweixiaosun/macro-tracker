    // 获取本地 YYYY-MM-DD 格式日期字符串
    const getLocalDateStr = (dateObj = new Date()) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    // 日期加减天数辅助函数
    const shiftDateStr = (dateStr, days) => {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return getLocalDateStr(dt);
    };

    // 前端图片压缩函数
    const compressImageFile = (file, maxWidth = 800, quality = 0.8) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64Data = dataUrl.split(',')[1];
            resolve({ dataUrl, base64Data, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    const GOAL_CONFIGS = {
      cut:      { label: '减脂 (-20% 热量缺口)', calMulti: 0.80, carbRatio: 0.40, proRatio: 0.35, fatRatio: 0.25 },
      maintain: { label: '维持体重 (平热量 TDEE)', calMulti: 1.00, carbRatio: 0.45, proRatio: 0.30, fatRatio: 0.25 },

    };

    function MacroTrackerApp() {
      const todayStr = getLocalDateStr();
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [trendRange, setTrendRange] = useState(7);

      // 卡片步骤视图控制
      const [currentStep, setCurrentStep] = useState(1); // 1: 👤状态 2: 📷饮食 3: 🚴运动 4: 📈趋势 5: 🏆结算

      // 顶部系统/设置抽屉
      const [showSystemSettings, setShowSystemSettings] = useState(false);

      // 跨设备同步状态
      const [importMode, setImportMode] = useState('merge');
      const [syncCodeInput, setSyncCodeInput] = useState('');
      const [syncNotice, setSyncNotice] = useState('');
      const fileInputRef = useRef(null);

      // AI 拍照识别状态
      const [aiConfig, setAiConfig] = useState(() => {
        const saved = localStorage.getItem('macro_ai_config_v7');
        return saved ? JSON.parse(saved) : { provider: 'gemini', apiKey: '' };
      });
      const [aiLoading, setAiLoading] = useState(false);
      const [aiPreviewUrl, setAiPreviewUrl] = useState('');
      const [aiDetectedFoods, setAiDetectedFoods] = useState([]);
      const [aiError, setAiError] = useState('');
      const cameraInputRef = useRef(null);

      // AI 建议状态
      const [aiAdvice, setAiAdvice] = useState('');
      const [aiAdviceLoading, setAiAdviceLoading] = useState(false);

      // 用户基础档案
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('macro_profile_v4');
        return saved ? JSON.parse(saved) : {
          gender: 'male', age: 26, height: 175, weight: 70, activity: 1.375, goal: 'cut'
        };
      });

      // 历史记录
      const [historyDB, setHistoryDB] = useState(() => {
        const saved = localStorage.getItem('macro_history_v5');
        if (saved) return JSON.parse(saved);

        const oldMeals = JSON.parse(localStorage.getItem('macro_meals_v4') || '[]');
        const oldWorkouts = JSON.parse(localStorage.getItem('macro_workouts_v4') || '[]');
        const oldProf = JSON.parse(localStorage.getItem('macro_profile_v4') || '{"weight":70}');

        if (oldMeals.length > 0 || oldWorkouts.length > 0) {
          return {
            [todayStr]: {
              weight: Number(oldProf.weight) || 70,
              meals: oldMeals,
              workouts: oldWorkouts
            }
          };
        }
        return {};
      });

      const [activeCategory, setActiveCategory] = useState('全部');
      const [searchQuery, setSearchQuery] = useState('');
      const [multiplier, setMultiplier] = useState(1);
      const [customFood, setCustomFood] = useState({ name: '', carb: '', pro: '', fat: '' });

      const [exFilter, setExFilter] = useState('全部');
      const [offsetMode, setOffsetMode] = useState('smart');
      const [logDuration, setLogDuration] = useState(30);

      useEffect(() => {
        localStorage.setItem('macro_profile_v4', JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem('macro_history_v5', JSON.stringify(historyDB));
      }, [historyDB]);

      useEffect(() => {
        localStorage.setItem('macro_ai_config_v7', JSON.stringify(aiConfig));
      }, [aiConfig]);

      const currentDayData = historyDB[selectedDate] || {
        weight: profile.weight,
        meals: [],
        workouts: []
      };

      const meals = currentDayData.meals || [];
      const workouts = currentDayData.workouts || [];
      const activeWeight = Number(currentDayData.weight ?? profile.weight) || 70;

      const updateDayRecord = (updater) => {
        setHistoryDB(prev => {
          const existing = prev[selectedDate] || { weight: profile.weight, meals: [], workouts: [] };
          const updated = updater(existing);
          return { ...prev, [selectedDate]: updated };
        });
      };

      const handleDayWeightChange = (val) => {
        if (selectedDate === todayStr) {
          setProfile(p => ({ ...p, weight: val }));
        }
        updateDayRecord(rec => ({ ...rec, weight: val }));
      };

      const calcTdeeForWeight = (w) => {
        const { gender, age, height, activity } = profile;
        let bmr = (10 * (Number(w) || 70)) + (6.25 * (Number(height) || 175)) - (5 * (Number(age) || 26));
        bmr += gender === 'male' ? 5 : -161;
        return {
          bmr: Math.round(bmr),
          tdee: Math.round(bmr * Number(activity))
        };
      };

      const targets = useMemo(() => {
        const { bmr, tdee } = calcTdeeForWeight(activeWeight);
        const cfg = GOAL_CONFIGS[profile.goal];
        const cal = Math.round(tdee * cfg.calMulti);

        return {
          bmr,
          tdee,
          cal,
          plannedDeficit: Math.round(tdee - cal),
          carb: Math.round((cal * cfg.carbRatio) / 4),
          pro: Math.round((cal * cfg.proRatio) / 4),
          fat: Math.round((cal * cfg.fatRatio) / 9)
        };
      }, [profile, activeWeight]);

      const totals = useMemo(() => {
        return meals.reduce((acc, item) => ({
          carb: +(acc.carb + item.carb).toFixed(1),
          pro: +(acc.pro + item.pro).toFixed(1),
          fat: +(acc.fat + item.fat).toFixed(1),
          cal: Math.round(acc.cal + item.cal)
        }), { carb: 0, pro: 0, fat: 0, cal: 0 });
      }, [meals]);

      const burnedCalories = useMemo(() => {
        return workouts.reduce((sum, w) => sum + w.cal, 0);
      }, [workouts]);

      const effectiveTargetCal = targets.cal + burnedCalories;
      const calDiff = effectiveTargetCal - totals.cal;
      const actualDeficit = (targets.tdee + burnedCalories) - totals.cal;
      const weeklyWeightChangeKg = ((actualDeficit * 7) / 7700).toFixed(2);

      const trendSeries = useMemo(() => {
        const days = [];
        let lastKnownWeight = Number(profile.weight) || 70;

        for (let i = trendRange - 1; i >= 0; i--) {
          const dStr = shiftDateStr(selectedDate, -i);
          const rec = historyDB[dStr];
          const hasMealsOrWorkouts = rec && ((rec.meals && rec.meals.length > 0) || (rec.workouts && rec.workouts.length > 0));
          const hasWeight = rec && rec.weight !== undefined && rec.weight !== '';

          if (hasWeight) {
            lastKnownWeight = Number(rec.weight);
          }

          const dayWeight = hasWeight ? Number(rec.weight) : lastKnownWeight;
          const { tdee } = calcTdeeForWeight(dayWeight);
          const intake = rec?.meals ? rec.meals.reduce((s, m) => s + m.cal, 0) : 0;
          const burned = rec?.workouts ? rec.workouts.reduce((s, w) => s + w.cal, 0) : 0;
          const deficit = hasMealsOrWorkouts ? (tdee + burned - intake) : null;

          days.push({
            date: dStr,
            shortDate: dStr.slice(5),
            weight: dayWeight,
            hasWeight,
            hasMealsOrWorkouts,
            intake,
            burned,
            tdee,
            deficit
          });
        }
        return days;
      }, [historyDB, selectedDate, trendRange, profile]);

      const trendSummary = useMemo(() => {
        const activeDays = trendSeries.filter(d => d.deficit !== null);
        const totalDeficit = activeDays.reduce((s, d) => s + d.deficit, 0);
        const estFatLossKg = (totalDeficit / 7700).toFixed(2);

        const weights = trendSeries.map(d => d.weight);
        const firstW = weights[0] || activeWeight;
        const lastW = weights[weights.length - 1] || activeWeight;
        const weightDiff = +(lastW - firstW).toFixed(2);

        return {
          recordedCount: activeDays.length,
          totalDeficit,
          estFatLossKg,
          weightDiff
        };
      }, [trendSeries, activeWeight]);

      const targetBurnCal = useMemo(() => {
        if (offsetMode === 'all') return Math.max(100, totals.cal);
        if (offsetMode === 'd300') return 300;
        if (offsetMode === 'd500') return 500;
        return calDiff < 0 ? Math.abs(calDiff) : 400;
      }, [offsetMode, totals.cal, calDiff]);

      const filteredDB = useMemo(() => {
        return ASIAN_FOOD_DB.filter(item => {
          const matchCat = activeCategory === '全部' || item.category === activeCategory;
          const matchQuery = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             item.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchQuery;
        });
      }, [activeCategory, searchQuery]);

      const filteredExercises = useMemo(() => {
        return EXERCISE_DB.filter(ex => exFilter === '全部' || ex.type === exFilter);
      }, [exFilter]);

      const addFromDB = (food) => {
        const m = Number(multiplier) || 1;
        const carb = +(food.carb * m).toFixed(1);
        const pro = +(food.pro * m).toFixed(1);
        const fat = +(food.fat * m).toFixed(1);
        const cal = Math.round(carb * 4 + pro * 4 + fat * 9);
        const label = m === 1 ? food.name : `${food.name} (${m}x)`;

        updateDayRecord(rec => ({
          ...rec,
          meals: [{ id: Date.now() + Math.random(), name: label, carb, pro, fat, cal }, ...(rec.meals || [])]

          ...rec,
          meals: [{
            id: Date.now(),

        updateDayRecord(rec => ({
          ...rec,

          const promptText = `你是一位精通中国菜（尤其是川菜、巴蜀小吃）与亚洲美食的专业营养师。
请仔细识别这张图片中的食物或食品成分表，估算其可食部重量，并严格只返回如下格式的纯 JSON 对象（不要 markdown 代码块包裹，不要其他文字）：
{"foods":[{"name":"食物中文名称(含估算克数或份量)","carb":碳水克数数字,"pro":蛋白质克数数字,"fat":脂肪克数数字,"note":"简短估算依据"}]}`;

          let rawResultText = '';

          if (aiConfig.provider === 'gemini') {
            const resp = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${aiConfig.apiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [
                      { text: promptText },
                      { inline_data: { mime_type: mimeType, data: base64Data } }
                    ]
                  }],
                  generationConfig: { responseMimeType: 'application/json' }
                })
              }
            );
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'Gemini API 请求失败');
            rawResultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else {
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConfig.apiKey.trim()}`

                model: 'gpt-4o-mini',

                  role: 'user',
                  content: [
                    { type: 'text', text: promptText },

                }]

            rawResultText = data.choices?.[0]?.message?.content || '';

          const parsed = JSON.parse(rawResultText.replace(/```json|```/g, '').trim());

            resultAdvice = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${aiConfig.apiKey.trim()}`
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: advicePrompt }]
              })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'OpenAI 请求失败');
            resultAdvice = data.choices?.[0]?.message?.content || '';
          }

          setAiAdvice(resultAdvice);
        } catch (err) {
          setAiAdvice(`❌ AI点评生成失败：${err.message}`);
        } finally {
          setAiAdviceLoading(false);
        }
      };

      // 备份与恢复 payload
      const buildBackupPayload = () => ({
        version: 'v8', exportedAt: new Date().toISOString(), profile, aiConfig, historyDB
      });

      const downloadJsonBackup = () => {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `macro_tracker_backup_${todayStr}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setSyncNotice('✅ 备份下载成功！');
      };

      const copySyncString = async () => {
        try {
          const payload = buildBackupPayload();
          const encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
          await navigator.clipboard.writeText(encoded);
          setSyncNotice('✅ 同步码已复制到剪贴板！');
        } catch (err) {
          setSyncNotice('❌ 复制失败');
        }
      };

      const applyImportedPayload = (parsed) => {
        if (!parsed || typeof parsed !== 'object' || (!parsed.historyDB && !parsed.profile)) {
          throw new Error('无效数据');
        }
        if (parsed.profile) setProfile(prev => ({ ...prev, ...parsed.profile }));
        if (parsed.aiConfig?.apiKey) setAiConfig(parsed.aiConfig);
        if (parsed.historyDB) {
          if (importMode === 'overwrite') {
            setHistoryDB(parsed.historyDB);

            setHistoryDB(prev => {
              const merged = { ...prev };
              Object.entries(parsed.historyDB).forEach(([k, day]) => {
                if (!merged[k]) { merged[k] = day; }
                else {
                  const mId = new Set((merged[k].meals || []).map(m => m.id));
                  const mergedM = [...(merged[k].meals || []), ...(day.meals || []).filter(x => !mId.has(x.id))];
                  const wId = new Set((merged[k].workouts || []).map(x => x.id));
                  const mergedW = [...(merged[k].workouts || []), ...(day.workouts || []).filter(x => !wId.has(x.id))];
                  merged[k] = { weight: day.weight ?? merged[k].weight, meals: mergedM, workouts: mergedW };
                }

              return merged;

        setSyncNotice(`🎉 成功恢复数据`);

      return (

                    <span className="text-xl font-bold">{targets.tdee} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-l border-indigo-800/80">
                    <span className="text-[10px] text-emerald-400 block">今日运动额外消耗</span>
                    <span className="text-xl font-bold text-emerald-400">+{burnedCalories} <small className="text-xs">kcal</small></span>
                  </div>
                  <div className="border-t border-indigo-800/80 pt-3">
                    <span className="text-[10px] text-indigo-300 block">饮食摄入累计</span>
                    <span className="text-xl font-bold">{totals.cal} <small className="text-xs">kcal</small></span>
                    <span className="text-[9px] text-indigo-400 block mt-0.5">理想目标 {targets.cal} kcal</span>
                  </div>
                  <div className="border-t border-l border-indigo-800/80 pt-3">
                    <span className="text-[10px] text-indigo-300 block font-bold">最终造成的缺口</span>
                    <span className={`text-xl font-black ${actualDeficit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {actualDeficit >= 0 ? `-${actualDeficit}` : `+${Math.abs(actualDeficit)}`} <small className="text-xs font-bold">kcal</small>
                    </span>
                    <span className="text-[9px] text-indigo-400 block mt-0.5">理论减脂：{weeklyWeightChangeKg} kg/周</span>
                  </div>
                </div>

                {/* 能量条进度 */}
                <div className="space-y-1 pt-1">
                  <div className="flex justify-between text-[10px] text-indigo-200">
                    <span>热量摄入进度</span>
                    <span>{totals.cal} / {effectiveTargetCal} kcal</span>
                  </div>
                  <div className="w-full h-2.5 bg-indigo-950/80 rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all ${calDiff >= 0 ? 'bg-indigo-400' : 'bg-rose-500'}`}
                      style={{ width: `${Math.min(100, Math.round((totals.cal / effectiveTargetCal) * 100))}%` }}
                    />
                  </div>
                </div>

                {/* 三大营养素 */}
                <div className="grid grid-cols-3 gap-2 border-t border-indigo-800/60 pt-3.5 text-center text-[10px]">
                  <div className="bg-indigo-950/50 p-2 rounded-lg">
                    <span className="text-amber-400 block font-bold">碳水化合物</span>
                    <span className="text-sm font-bold block mt-0.5">{totals.carb} / {targets.carb}g</span>
                  </div>
                  <div className="bg-indigo-950/50 p-2 rounded-lg">
                    <span className="text-sky-400 block font-bold">蛋白质</span>
                    <span className="text-sm font-bold block mt-0.5">{totals.pro} / {targets.pro}g</span>
                  </div>
                  <div className="bg-indigo-950/50 p-2 rounded-lg">
                    <span className="text-rose-400 block font-bold">脂肪</span>
                    <span className="text-sm font-bold block mt-0.5">{totals.fat} / {targets.fat}g</span>
                  </div>
                </div>
              </div>

              {/* 📷 录入摘要 */}
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs">
                <span className="font-bold text-slate-600 block mb-1">📝 今日餐练简要</span>
                {meals.length === 0 && workouts.length === 0 ? (
                  <span className="text-slate-400">今日暂无餐单或运动录入，请在前几页打卡。</span>
                ) : (
                  <div className="text-[11px] text-slate-500 flex flex-wrap gap-1.5 leading-relaxed">
                    {meals.map(m => (
                      <span key={m.id} className="bg-white border border-slate-200 px-2 py-0.5 rounded truncate max-w-[120px]">{m.name}</span>
                    ))}
                    {workouts.map(w => (
                      <span key={w.id} className="bg-emerald-50 text-emerald-700 border border-emerald-250 px-2 py-0.5 rounded truncate max-w-[120px]">{w.name}({w.mins}分)</span>
                    ))}
                  </div>
                )}
              </div>

              {/* AI 建议与明日规划安排区域 */}
              <div className="border-t border-slate-100 pt-3.5 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5">🤖 AI 今日点评与明日实操安排</span>
                  <button
                    onClick={handleGetAiAdvice}
                    disabled={aiAdviceLoading}
                    className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1"
                  >
                    {aiAdviceLoading ? '⏳ AI正在分析中...' : '💬 点评及明日安排'}
                  </button>
                </div>

                {aiAdvice && (
                  <div className="bg-indigo-50/60 border border-indigo-150 p-4 rounded-xl text-xs text-slate-700 leading-relaxed font-normal whitespace-pre-line shadow-inner">
                    {aiAdvice}
                  </div>
                )}
                {!aiAdvice && !aiAdviceLoading && (
                  <div className="text-slate-400 text-xs text-center py-4 bg-slate-50 border border-slate-200 rounded-xl border-dashed">
                    想要了解今日得失？点击「点评及明日安排」按钮，大模型将根据你的历史和今日数据生成规划
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 底部前后快速翻页导航 */}
          <div className="flex items-center justify-between border-t border-slate-200 pt-3 text-xs">
            <button
              onClick={() => setCurrentStep(prev => Math.max(1, prev - 1))}
              disabled={currentStep === 1}
              className="text-slate-500 disabled:opacity-30 border border-slate-200 rounded-xl px-4 py-2 hover:bg-slate-100 bg-white"
            >
              ◀ 上一步
            </button>
            <span className="text-slate-400 font-medium">第 {currentStep} / 5 页</span>
            <button
              onClick={() => {
                if (currentStep < 5) setCurrentStep(currentStep + 1);
                else alert('祝贺！今天的膳练任务已全打卡完成，点击上面 AI 可以生成定制明日规划！');
              }}
              className="bg-indigo-600 text-white font-bold rounded-xl px-4 py-2 hover:bg-indigo-700"
            >
              {currentStep === 5 ? '🎉 结束打卡' : '下一步 ▶'}
            </button>
          </div>
        </div>
      );
    }

    // 历史数据的处理
    const weights = [];
    const minW = 0, maxW = 0, wSpan = 1;
    let weightPoints = [];
    let maxAbsDeficit = 600;

    ReactDOM.render(<MacroTrackerApp />, document.getElementById('root'));
  </script>
</body>
</html>

    const safeGetStorage = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) { return fallback; }
    };

    const getLocalDateStr = (dateObj = new Date()) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const shiftDateStr = (dateStr, days) => {
      if (!dateStr || typeof dateStr !== 'string') return getLocalDateStr();
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return getLocalDateStr();
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      dt.setDate(dt.getDate() + days);
      return getLocalDateStr(dt);
    };

    const compressImageFile = (file, maxWidth = 800, quality = 0.8) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height;
            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({ dataUrl, base64Data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.onerror = reject; img.src = e.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    };

    // 智能 JSON 提取器：解决大模型在 JSON 后追加额外字符或拆分多个块导致的解析报错
    const parseAiFoodsJson = (rawText) => {
      if (!rawText || typeof rawText !== 'string') return [];
      const cleaned = rawText.replace(/```json|```/gi, '').trim();

      // 1. 尝试直接解析
      try {
        const direct = JSON.parse(cleaned);
        if (Array.isArray(direct)) return direct;
        if (Array.isArray(direct.foods)) return direct.foods;
        if (direct.name) return [direct];
      } catch (e) {}

      // 2. 括号平衡扫描法：提取文本中所有顶层 {...} 对象
      const extractedObjects = [];
      let depth = 0, startIdx = -1, inStr = false, escape = false;
      for (let i = 0; i < cleaned.length; i++) {
        const ch = cleaned[i];
        if (escape) { escape = false; continue; }
        if (ch === '\\' && inStr) { escape = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (!inStr) {
          if (ch === '{') {
            if (depth === 0) startIdx = i;
            depth++;
          } else if (ch === '}') {
            depth--;
            if (depth === 0 && startIdx !== -1) {
              const candidate = cleaned.slice(startIdx, i + 1);
              try {
                const obj = JSON.parse(candidate);
                extractedObjects.push(obj);
              } catch (err) {}
              startIdx = -1;
            }
          }
        }
      }

      const finalFoods = [];
      for (const obj of extractedObjects) {
        if (Array.isArray(obj.foods)) {
          finalFoods.push(...obj.foods);
        } else if (obj.name && (obj.carb !== undefined || obj.pro !== undefined || obj.fat !== undefined)) {
          finalFoods.push(obj);
        }
      }
      return finalFoods;
    };

    function MacroTrackerApp() {
      const todayStr = getLocalDateStr();

      });
      const [aiLoading, setAiLoading] = useState(false);

      const [aiAdvice, setAiAdvice] = useState('');
      const [aiAdviceLoading, setAiAdviceLoading] = useState(false);

      const [profile, setProfile] = useState(() => {
        const saved = safeGetStorage('macro_profile_v4', null);
        return {
          gender: saved?.gender || 'male',
          age: Number(saved?.age) || 26,
          height: Number(saved?.height) || 175,
          weight: Number(saved?.weight) || 70,
          activity: Number(saved?.activity) || 1.375,
          goal: GOAL_CONFIGS[saved?.goal] ? saved.goal : 'cut'
        };
      });

      const [historyDB, setHistoryDB] = useState(() => {
        const saved = safeGetStorage('macro_history_v5', null);
        return (saved && typeof saved === 'object') ? saved : {};
      });

      const [activeCategory, setActiveCategory] = useState('全部');
      const [searchQuery, setSearchQuery] = useState('');
      const [multiplier, setMultiplier] = useState(1);
      const [customFood, setCustomFood] = useState({ name: '', carb: '', pro: '', fat: '' });

      const [exFilter, setExFilter] = useState('全部');
      const [offsetMode, setOffsetMode] = useState('smart');
      const [logDuration, setLogDuration] = useState(30);

      useEffect(() => { try { localStorage.setItem('macro_profile_v4', JSON.stringify(profile)); } catch (e) {} }, [profile]);
      useEffect(() => { try { localStorage.setItem('macro_history_v5', JSON.stringify(historyDB)); } catch (e) {} }, [historyDB]);
      useEffect(() => { try { localStorage.setItem('macro_ai_config_v7', JSON.stringify(aiConfig)); } catch (e) {} }, [aiConfig]);

      const currentDayData = (historyDB && historyDB[selectedDate]) ? historyDB[selectedDate] : { weight: profile.weight, meals: [], workouts: [] };
      const meals = Array.isArray(currentDayData.meals) ? currentDayData.meals : [];
      const workouts = Array.isArray(currentDayData.workouts) ? currentDayData.workouts : [];
      const activeWeight = Number(currentDayData.weight ?? profile.weight) || 70;

      const updateDayRecord = (updater) => {
        setHistoryDB(prev => {
          const safePrev = prev && typeof prev === 'object' ? prev : {};
          const existing = safePrev[selectedDate] || { weight: profile.weight, meals: [], workouts: [] };
          const updated = updater({
            weight: existing.weight ?? profile.weight,
            meals: Array.isArray(existing.meals) ? existing.meals : [],
            workouts: Array.isArray(existing.workouts) ? existing.workouts : []
          });
          return { ...safePrev, [selectedDate]: updated };
        });
      };

      const handleDayWeightChange = (val) => {
        if (selectedDate === todayStr) setProfile(p => ({ ...p, weight: val }));
        updateDayRecord(rec => ({ ...rec, weight: val }));
      };

      const calcTdeeForWeight = (w) => {
        const { gender, age, height, activity } = profile;
        let bmr = (10 * (Number(w) || 70)) + (6.25 * (Number(height) || 175)) - (5 * (Number(age) || 26));
        bmr += gender === 'male' ? 5 : -161;
        const act = Number(activity) || 1.375;
        return { bmr: Math.max(800, Math.round(bmr)), tdee: Math.max(1000, Math.round(bmr * act)) };
      };

      const targets = useMemo(() => {
        const { bmr, tdee } = calcTdeeForWeight(activeWeight);
        const cfg = GOAL_CONFIGS[profile.goal] || GOAL_CONFIGS.cut;
        const cal = Math.max(800, Math.round(tdee * cfg.calMulti));
        return {
          bmr, tdee, cal,
          plannedDeficit: Math.round(tdee - cal),
          carb: Math.round((cal * cfg.carbRatio) / 4),
          pro: Math.round((cal * cfg.proRatio) / 4),
          fat: Math.round((cal * cfg.fatRatio) / 9)
        };
      }, [profile, activeWeight]);

      const totals = useMemo(() => {
        return meals.reduce((acc, item) => ({
          carb: +(acc.carb + (Number(item?.carb) || 0)).toFixed(1),
          pro: +(acc.pro + (Number(item?.pro) || 0)).toFixed(1),
          fat: +(acc.fat + (Number(item?.fat) || 0)).toFixed(1),
          cal: Math.round(acc.cal + (Number(item?.cal) || 0))
        }), { carb: 0, pro: 0, fat: 0, cal: 0 });
      }, [meals]);

      const burnedCalories = useMemo(() => workouts.reduce((sum, w) => sum + (Number(w?.cal) || 0), 0), [workouts]);
      const effectiveTargetCal = Math.max(800, targets.cal + burnedCalories);
      const calDiff = effectiveTargetCal - totals.cal;
      const actualDeficit = (targets.tdee + burnedCalories) - totals.cal;
      const weeklyWeightChangeKg = ((actualDeficit * 7) / 7700).toFixed(2);

      const trendSeries = useMemo(() => {
        const days = [];
        let lastKnownWeight = Number(profile.weight) || 70;
        for (let i = trendRange - 1; i >= 0; i--) {
          const dStr = shiftDateStr(selectedDate, -i);
          const rec = historyDB ? historyDB[dStr] : null;
          const mArr = Array.isArray(rec?.meals) ? rec.meals : [];
          const wArr = Array.isArray(rec?.workouts) ? rec.workouts : [];
          const hasMealsOrWorkouts = mArr.length > 0 || wArr.length > 0;
          const hasWeight = rec && rec.weight !== undefined && rec.weight !== '' && !isNaN(Number(rec.weight));
          if (hasWeight) lastKnownWeight = Number(rec.weight);
          const dayWeight = hasWeight ? Number(rec.weight) : lastKnownWeight;
          const { tdee } = calcTdeeForWeight(dayWeight);
          const intake = mArr.reduce((s, m) => s + (Number(m?.cal) || 0), 0);
          const burned = wArr.reduce((s, w) => s + (Number(w?.cal) || 0), 0);
          const deficit = hasMealsOrWorkouts ? (tdee + burned - intake) : null;
          days.push({ date: dStr, shortDate: dStr.slice(5), weight: dayWeight, hasWeight, hasMealsOrWorkouts, intake, burned, tdee, deficit });
        }
        return days;
      }, [historyDB, selectedDate, trendRange, profile]);

      const trendSummary = useMemo(() => {
        const activeDays = trendSeries.filter(d => d.deficit !== null);
        const totalDeficit = activeDays.reduce((s, d) => s + d.deficit, 0);
        const estFatLossKg = (totalDeficit / 7700).toFixed(2);
        const weights = trendSeries.map(d => d.weight);
        const weightDiff = +((weights[weights.length - 1] || activeWeight) - (weights[0] || activeWeight)).toFixed(2);
        return { recordedCount: activeDays.length, totalDeficit, estFatLossKg, weightDiff };
      }, [trendSeries, activeWeight]);

      const maxAbsDeficit = useMemo(() => Math.max(600, ...trendSeries.map(d => (d.deficit !== null ? Math.abs(d.deficit) : 0))), [trendSeries]);

      const weightPoints = useMemo(() => {
        if (!trendSeries || trendSeries.length === 0) return [];
        const wArr = trendSeries.map(d => Number(d.weight) || 70);
        const minW = Math.min(...wArr) - 0.8, maxW = Math.max(...wArr) + 0.8, wSpan = Math.max(1.5, maxW - minW);
        const padX = 28, padY = 22, innerW = 520 - 56, innerH = 140 - 44;
        return trendSeries.map((d, idx) => ({
          x: Math.round(padX + (trendSeries.length === 1 ? innerW / 2 : (idx / (trendSeries.length - 1)) * innerW)),
          y: Math.round(padY + innerH - (((Number(d.weight) || 70) - minW) / wSpan) * innerH),
          ...d
        }));
      }, [trendSeries]);

      const targetBurnCal = useMemo(() => {
        if (offsetMode === 'all') return Math.max(100, totals.cal);
        return calDiff < 0 ? Math.abs(calDiff) : 400;
      }, [offsetMode, totals.cal, calDiff]);

      const filteredDB = useMemo(() => {
        const q = (searchQuery || '').toLowerCase();
        return ASIAN_FOOD_DB.filter(item => {
          const matchCat = activeCategory === '全部' || item.category === activeCategory;
          return matchCat && (item.name.toLowerCase().includes(q) || item.category.toLowerCase().includes(q));
        });
      }, [activeCategory, searchQuery]);

      const filteredExercises = useMemo(() => EXERCISE_DB.filter(ex => exFilter === '全部' || ex.type === exFilter), [exFilter]);

      const addFromDB = (food) => {
        const m = Number(multiplier) || 1;
        const carb = +(food.carb * m).toFixed(1), pro = +(food.pro * m).toFixed(1), fat = +(food.fat * m).toFixed(1);
        const cal = Math.round(carb * 4 + pro * 4 + fat * 9);
        updateDayRecord(rec => ({
          ...rec,
          meals: [{ id: Date.now() + Math.random(), name: m === 1 ? food.name : `${food.name} (${m}x)`, carb, pro, fat, cal }, ...rec.meals]
        }));

      const handleCustomAdd = (e) => {
        e.preventDefault();
        const carb = Math.max(0, parseFloat(customFood.carb) || 0), pro = Math.max(0, parseFloat(customFood.pro) || 0), fat = Math.max(0, parseFloat(customFood.fat) || 0);

        const cal = Math.round(carb * 4 + pro * 4 + fat * 9);
        updateDayRecord(rec => ({
          ...rec,
          meals: [{ id: Date.now(), name: (customFood.name || '').trim() || '自定义餐品', carb, pro, fat, cal }, ...rec.meals]

      const logExercise = (ex, customMinutes) => {
        const mins = Math.max(1, Number(customMinutes) || Number(logDuration) || 30);
        const burned = Math.round(((ex.met * 3.5 * activeWeight) / 200) * mins);
        updateDayRecord(rec => ({
          ...rec,
          workouts: [{ id: Date.now() + Math.random(), name: ex.name, type: ex.type, mins, cal: burned }, ...rec.workouts]

      const handlePhotoCapture = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = '';

        if (!aiConfig.apiKey || !aiConfig.apiKey.trim()) {
          setShowSystemSettings(true);
          alert('⚠️ 请先在右上角展开的设置面板中填入你的 API Key。');
          return;
        }

        setAiError('');
        setAiLoading(true);
        setAiDetectedFoods([]);

        try {
          const { dataUrl, base64Data, mimeType } = await compressImageFile(file);
          setAiPreviewUrl(dataUrl);

          const promptText = `你是一位精通中国菜（尤其是川菜、巴蜀小吃）与亚洲美食的专业营养师。请识别这张图片中的食物或营养成分表，估算其可食部重量，仅输出如下格式的纯 JSON 对象，严禁输出任何其他多余文字或注释：{"foods":[{"name":"食物名称(含估算克数)","carb":碳水克数数字,"pro":蛋白质克数数字,"fat":脂肪克数数字,"note":"简短依据"}]}`;
          let rawResultText = '';

          if (aiConfig.provider === 'gemini') {
            const geminiModel = (aiConfig.model || 'gemini-2.0-flash').trim();
            const resp = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${aiConfig.apiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: mimeType, data: base64Data } }] }],
                  generationConfig: { responseMimeType: 'application/json' }
                })
              }
            );
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'Gemini API 请求失败');
            rawResultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else if (aiConfig.provider === 'zhipu') {
            const resp = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${aiConfig.apiKey.trim()}` },
              body: JSON.stringify({
                model: (aiConfig.model || 'glm-4v-flash').trim(),
                messages: [{
                  role: 'user',
                  content: [
                    { type: 'text', text: promptText },
                    { type: 'image_url', image_url: { url: dataUrl } }
                  ]
                }]
              })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || '智谱 API 请求失败');
            rawResultText = data.choices?.[0]?.message?.content || '';
          } else {
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${aiConfig.apiKey.trim()}` },
              body: JSON.stringify({
                model: (aiConfig.model || 'gpt-4o-mini').trim(),
                response_format: { type: 'json_object' },
                messages: [{ role: 'user', content: [{ type: 'text', text: promptText }, { type: 'image_url', image_url: { url: dataUrl } }] }]
              })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'OpenAI API 失败');
            rawResultText = data.choices?.[0]?.message?.content || '';
          }

          const list = parseAiFoodsJson(rawResultText);
          if (list.length === 0) {
            setAiError('未识别出明确食物，请换个清晰角度重试。');
          } else {
            setAiDetectedFoods(list.map((f, i) => {
              const carb = +(Number(f.carb) || 0).toFixed(1), pro = +(Number(f.pro) || 0).toFixed(1), fat = +(Number(f.fat) || 0).toFixed(1);
              return { id: Date.now() + i, name: f.name || 'AI识别餐品', carb, pro, fat, cal: Math.round(carb * 4 + pro * 4 + fat * 9), note: f.note || '' };
            }));
          }
        } catch (err) {
          setAiError(`❌ 识别出错：${err.message}`);
        } finally {
          setAiLoading(false);
        }
      };

      const confirmAddAiFood = (item) => {
        updateDayRecord(rec => ({
          ...rec,
          meals: [{ id: Date.now() + Math.random(), name: `📷 ${item.name}`, carb: item.carb, pro: item.pro, fat: item.fat, cal: item.cal }, ...rec.meals]
        }));
        setAiDetectedFoods(prev => prev.filter(f => f.id !== item.id));
      };

      const handleGetAiAdvice = async () => {
        if (!aiConfig.apiKey || !aiConfig.apiKey.trim()) {
          setShowSystemSettings(true);
          alert('请先在顶部设置面板中配置 API Key！');
          return;
        }
        setAiAdviceLoading(true);
        setAiAdvice('');

        try {
          const mealsSummary = meals.map(m => `${m.name}(${m.cal}kcal)`).join('、');
          const workoutSummary = workouts.map(w => `${w.name}(${w.mins}分/-${w.cal}kcal)`).join('、');
          const advicePrompt = `你是资深运动营养师。根据用户今日数据给出300字以内的【今日点评与明日三餐/运动实操规划】：
体重${activeWeight}kg，目标${(GOAL_CONFIGS[profile.goal] || GOAL_CONFIGS.cut).label}，TDEE ${targets.tdee}kcal，目标摄入${targets.cal}kcal，今日实际摄入${totals.cal}kcal(碳水${totals.carb}g/蛋白${totals.pro}g/脂肪${totals.fat}g)，运动消耗${burnedCalories}kcal，净热量缺口${actualDeficit}kcal。今日吃了：${mealsSummary || '未记录'}；运动：${workoutSummary || '未记录'}。`;

          let resultAdvice = '';

          if (aiConfig.provider === 'gemini') {
            const geminiModel = (aiConfig.model || 'gemini-2.0-flash').trim();
            const resp = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${aiConfig.apiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: advicePrompt }] }] })
              }
            );
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'Gemini 请求失败');
            resultAdvice = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else if (aiConfig.provider === 'zhipu') {
            const resp = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${aiConfig.apiKey.trim()}` },
              body: JSON.stringify({ model: 'glm-4-flash', messages: [{ role: 'user', content: advicePrompt }] })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || '智谱请求失败');
            resultAdvice = data.choices?.[0]?.message?.content || '';
          } else {
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${aiConfig.apiKey.trim()}` },
              body: JSON.stringify({ model: 'gpt-4o-mini', messages: [{ role: 'user', content: advicePrompt }] })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'OpenAI 请求失败');
            resultAdvice = data.choices?.[0]?.message?.content || '';
          }
          setAiAdvice(resultAdvice);
        } catch (err) {
          setAiAdvice(`❌ AI点评生成失败：${err.message}`);
        } finally {
          setAiAdviceLoading(false);
        }
      };

      const buildBackupPayload = () => ({ version: 'v8.5', exportedAt: new Date().toISOString(), profile, aiConfig, historyDB });

      const downloadJsonBackup = () => {
        const blob = new Blob([JSON.stringify(buildBackupPayload(), null, 2)], { type: 'application/json;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `macro_tracker_backup_${todayStr}.json`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        setSyncNotice('✅ 备份下载成功！');
      };

      const copySyncString = async () => {
        try {
          await navigator.clipboard.writeText(btoa(encodeURIComponent(JSON.stringify(buildBackupPayload()))));
          setSyncNotice('✅ 同步码已复制到剪贴板！');
        } catch (err) { setSyncNotice('❌ 复制失败'); }
      };

      const handleSyncCodeRestore = () => {
        const raw = syncCodeInput.trim();
        if (!raw) return;
        try {
          const parsed = raw.startsWith('{') ? JSON.parse(raw) : JSON.parse(decodeURIComponent(atob(raw)));
          if (parsed.profile) setProfile(prev => ({ ...prev, ...parsed.profile }));
          if (parsed.aiConfig?.apiKey) setAiConfig(prev => ({ ...prev, ...parsed.aiConfig }));
          if (parsed.historyDB) {
            setHistoryDB(prev => importMode === 'overwrite' ? parsed.historyDB : { ...(prev || {}), ...parsed.historyDB });
          }
          setSyncNotice('🎉 成功恢复数据'); setSyncCodeInput('');
        } catch (err) { setSyncNotice('❌ 同步码解析失败'); }
      };

      const exportHistoryCSV = () => {
        const sortedDates = Object.keys(historyDB || {}).sort();
        if (sortedDates.length === 0) return alert('暂无历史打卡记录可导出！');
        const headers = ['日期', '当日体重(kg)', '基础消耗TDEE(kcal)', '饮食摄入(kcal)', '碳水(g)', '蛋白质(g)', '脂肪(g)', '运动消耗(kcal)', '真实热量缺口(kcal)'];
        const rows = sortedDates.map(d => {
          const rec = historyDB[d] || {}, w = Number(rec.weight || profile.weight) || 70, { tdee } = calcTdeeForWeight(w);
          const mList = Array.isArray(rec.meals) ? rec.meals : [], wList = Array.isArray(rec.workouts) ? rec.workouts : [];
          const intake = mList.reduce((s, i) => s + (Number(i?.cal) || 0), 0);
          const carb = mList.reduce((s, i) => s + (Number(i?.carb) || 0), 0).toFixed(1);
          const pro = mList.reduce((s, i) => s + (Number(i?.pro) || 0), 0).toFixed(1);
          const fat = mList.reduce((s, i) => s + (Number(i?.fat) || 0), 0).toFixed(1);
          const burned = wList.reduce((s, i) => s + (Number(i?.cal) || 0), 0);
          return [d, w, tdee, intake, carb, pro, fat, burned, tdee + burned - intake].join(',');
        });
        const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `膳食与运动历史报告_${todayStr}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const handleProviderChange = (newProvider) => {
        let defaultModel = 'glm-4v-flash';
        if (newProvider === 'gemini') defaultModel = 'gemini-2.0-flash';
        if (newProvider === 'openai') defaultModel = 'gpt-4o-mini';
        setAiConfig({ ...aiConfig, provider: newProvider, model: defaultModel });
      };

      return (
        <div className="max-w-xl mx-auto px-4 py-4 md:py-8 space-y-4">
          <header className="flex items-center justify-between pb-2 border-b border-slate-200">
            <h1 className="text-base sm:text-lg font-black text-slate-800 tracking-tight flex items-center gap-1.5">
              <span>🥗 膳食与运动追踪</span>
              <span className="text-[10px] font-semibold bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded border border-indigo-200">v8.5 终极版</span>
            </h1>
            <div className="flex items-center gap-1">
              <button type="button" onClick={() => setSelectedDate(shiftDateStr(selectedDate, -1))} className="px-1.5 py-1 text-slate-500 hover:bg-slate-100 rounded text-xs font-semibold">◀</button>
              <input type="date" value={selectedDate} onChange={e => e.target.value && setSelectedDate(e.target.value)} className="text-xs font-bold bg-indigo-50/70 border border-indigo-200 text-indigo-700 rounded px-1.5 py-1 w-[112px]" />
              <button type="button" onClick={() => setSelectedDate(shiftDateStr(selectedDate, 1))} className="px-1.5 py-1 text-slate-500 hover:bg-slate-100 rounded text-xs font-semibold">▶</button>
              <button type="button" onClick={() => setShowSystemSettings(!showSystemSettings)} className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 ml-1 border border-slate-200 shadow-sm text-xs">⚙️</button>
            </div>
          </header>

          {showSystemSettings && (
            <div className="bg-slate-900 text-white p-4 rounded-xl border border-slate-800 space-y-4 text-xs">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                <span className="font-bold">☁️ 跨设备同步 & AI 密钥设置</span>
                <button type="button" onClick={() => setShowSystemSettings(false)} className="text-slate-400">✕ 关闭</button>
              </div>
              <div className="space-y-2">
                <label className="block text-slate-400 font-semibold">AI 视觉模型与 API Key（推荐使用智谱免费版，免绑卡免VPN）</label>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                  <select value={aiConfig.provider} onChange={e => handleProviderChange(e.target.value)} className="rounded bg-slate-800 border border-slate-700 px-2.5 py-1.5 text-white">
                    <option value="zhipu">智谱 GLM-4V (免费免绑卡/免VPN)</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="openai">OpenAI (gpt-4o-mini)</option>
                  </select>
                  <input type="text" placeholder="模型名称" value={aiConfig.model || 'glm-4v-flash'} onChange={e => setAiConfig({ ...aiConfig, model: e.target.value })} className="rounded bg-slate-800 border border-slate-700 px-2.5 py-1.5 text-indigo-300 font-mono" />
                </div>
                <input type="password" placeholder="在此粘贴你的 API Key" value={aiConfig.apiKey} onChange={e => setAiConfig({ ...aiConfig, apiKey: e.target.value })} className="w-full rounded bg-slate-800 border border-slate-700 px-2.5 py-1.5 text-white" />
              </div>
              <div className="space-y-2 border-t border-slate-800/80 pt-2.5">
                <span className="text-slate-400 block font-semibold">设备间同步 / 备份</span>
                {syncNotice && <div className="text-amber-300 font-medium">{syncNotice}</div>}
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={copySyncString} className="bg-indigo-700 hover:bg-indigo-600 px-2 py-2 rounded font-bold">📋 复制同步码</button>
                  <button type="button" onClick={downloadJsonBackup} className="bg-slate-800 border border-slate-700 px-2 py-2 rounded">💾 下载 JSON 备份</button>
                </div>
                <div className="flex gap-1 pt-1.5">
                  <input type="text" placeholder="在此粘贴同步码或 JSON 文本..." value={syncCodeInput} onChange={e => setSyncCodeInput(e.target.value)} className="flex-1 bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-white" />
                  <button type="button" onClick={handleSyncCodeRestore} className="bg-emerald-500 text-slate-950 font-bold px-2.5 py-1.5 rounded text-xs shrink-0">恢复</button>
                </div>
              </div>
            </div>
          )}

          <nav className="flex items-center gap-1.5 overflow-x-auto pb-1 text-[11px] md:text-xs">
            {[
              { idx: 1, label: '1.👤状态' },
              { idx: 2, label: '2.📷膳食' },
              { idx: 3, label: '3.🚴运动' },
              { idx: 4, label: '4.📈趋势' },
              { idx: 5, label: '5.🏆结算' }
            ].map(b => (
              <button key={b.idx} type="button" onClick={() => setCurrentStep(b.idx)} className={`flex-1 min-w-[68px] text-center py-2 rounded-xl border transition-all font-semibold ${currentStep === b.idx ? 'bg-indigo-600 text-white shadow-sm border-indigo-600 font-bold' : 'bg-white text-slate-500 hover:bg-slate-100 border-slate-200'}`}>
                {b.label}
              </button>
            ))}
          </nav>

          {currentStep === 1 && (
            <div key="step-1" className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
              <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                <h2 className="text-sm font-black text-slate-800">👤 第 1 步：今日体重与基础状态</h2>
                <span className="text-xs text-indigo-600 font-semibold">{selectedDate}</span>
              </div>
              <div className="grid grid-cols-2 gap-3.5">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">性别</label>
                  <select value={profile.gender} onChange={e => setProfile({...profile, gender: e.target.value})} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs bg-slate-50">
                    <option value="male">男性</option><option value="female">女性</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">年龄</label>
                  <input type="number" value={profile.age} onChange={e => setProfile({...profile, age: Number(e.target.value) || 26})} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs bg-slate-50" />
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">身高 (cm)</label>
                  <input type="number" value={profile.height} onChange={e => setProfile({...profile, height: Number(e.target.value) || 175})} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs bg-slate-50" />
                </div>
                <div>
                  <label className="block text-xs text-indigo-700 font-bold mb-1">当日体重打卡 (kg)</label>
                  <input type="number" step="0.1" value={currentDayData.weight ?? profile.weight} onChange={e => handleDayWeightChange(e.target.value)} className="w-full rounded-lg border border-indigo-400 bg-indigo-50/50 px-3 py-2 text-xs font-black text-indigo-950" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">日常活动水平</label>
                  <select value={profile.activity} onChange={e => setProfile({...profile, activity: parseFloat(e.target.value)})} className="w-full rounded-lg border border-slate-300 px-2.5 py-2 text-xs bg-slate-50">
                    <option value={1.2}>久坐办公</option><option value={1.375}>轻度运动 (1-3天/周)</option><option value={1.55}>中度运动 (3-5天/周)</option><option value={1.725}>高频训练 (6-7天/周)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">阶段目标</label>
                  <select value={profile.goal} onChange={e => setProfile({...profile, goal: e.target.value})} className="w-full rounded-lg border border-slate-300 px-2.5 py-2 text-xs bg-slate-50">
                    {Object.entries(GOAL_CONFIGS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                  </select>
                </div>
              </div>
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200/70 text-center text-xs">
                <div className="grid grid-cols-3">
                  <div><span className="text-slate-400 block">基础代谢 BMR</span><span className="text-sm font-bold text-slate-700">{targets.bmr} kcal</span></div>
                  <div className="border-x border-slate-200/70"><span className="text-slate-400 block">日常总消耗 TDEE</span><span className="text-sm font-bold text-indigo-600">{targets.tdee} kcal</span></div>
                  <div><span className="text-slate-400 block">目标摄入上限</span><span className="text-sm font-bold text-emerald-600">{targets.cal} kcal</span></div>
                </div>
              </div>
              <button type="button" onClick={() => setCurrentStep(2)} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-indigo-700 transition">下一步：📷 记录今日饮食 ▶</button>
            </div>
          )}

          {currentStep === 2 && (
            <div key="step-2" className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex items-center justify-between border-b pb-2.5">
                <div>
                  <h2 className="text-sm font-black text-slate-800">🍜 第 2 步：记录饮食 ({totals.cal} kcal)</h2>
                  <p className="text-[11px] text-slate-400">拍照AI自动识别，或从 {ASIAN_FOOD_DB.length} 款美食库点选</p>
                </div>
                <div>
                  <input type="file" accept="image/*" ref={cameraInputRef} onChange={handlePhotoCapture} className="hidden" />
                  <button type="button" onClick={() => cameraInputRef.current?.click()} disabled={aiLoading} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm">
                    {aiLoading ? '⏳ 识别中...' : '📷 拍照识热量'}
                  </button>
                </div>
              </div>

              {aiError && <div className="bg-rose-50 text-rose-600 p-2.5 rounded-lg text-xs">{aiError}</div>}
              {(aiLoading || aiDetectedFoods.length > 0) && (
                <div className="bg-indigo-50/60 border border-indigo-200 p-3 rounded-xl space-y-2">
                  <div className="flex items-center gap-2">
                    {aiPreviewUrl && <img src={aiPreviewUrl} className="w-10 h-10 object-cover rounded-lg" />}
                    <span className="text-xs font-bold text-indigo-900">{aiLoading ? '🤖 正在分析图片中的食物份量与热量...' : '✨ AI 识别结果（点击确认入账）：'}</span>
                  </div>
                  {aiDetectedFoods.map(item => (
                    <div key={item.id} className="bg-white p-2.5 rounded-lg border border-indigo-100 flex items-center justify-between gap-2 text-xs">
                      <div>
                        <div className="font-bold text-slate-800">{item.name} <span className="text-indigo-600">({item.cal} kcal)</span></div>
                        <div className="text-[10px] text-slate-500">碳水 {item.carb}g · 蛋白 {item.pro}g · 脂肪 {item.fat}g {item.note && `(${item.note})`}</div>
                      </div>
                      <button type="button" onClick={() => confirmAddAiFood(item)} className="bg-indigo-600 text-white font-semibold px-2.5 py-1.5 rounded-lg text-[11px] shrink-0">+ 入账</button>
                    </div>
                  ))}
                </div>
              )}

              <div className="space-y-2.5">
                <div className="flex justify-between items-center text-xs">
                  <span className="text-slate-500 font-semibold">速查美食库 ({filteredDB.length}项):</span>
                  <div className="flex items-center gap-1">
                    <span className="text-[11px] text-slate-400">份量:</span>
                    {[0.5, 0.75, 1, 1.5].map(m => (
                      <button key={m} type="button" onClick={() => setMultiplier(m)} className={`px-2 py-0.5 rounded text-[11px] font-medium ${multiplier === m ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600'}`}>{m}x</button>
                    ))}
                  </div>
                </div>
                <input type="text" placeholder="搜索美食 (如: 豌杂面、火锅、钵钵鸡、鸡饭)..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <div className="flex gap-1.5 overflow-x-auto pb-1 text-[11px]">
                  {FOOD_CATEGORIES.map(cat => (
                    <button key={cat} type="button" onClick={() => setActiveCategory(cat)} className={`px-2.5 py-1 rounded-full shrink-0 transition ${activeCategory === cat ? 'bg-slate-800 text-white font-semibold' : 'bg-slate-100 text-slate-600'}`}>{cat}</button>
                  ))}
                </div>
                <div className="max-h-52 overflow-y-auto divide-y divide-slate-100 bg-slate-50/70 rounded-xl px-2.5 border border-slate-200/60">
                  {filteredDB.map(food => {
                    const estCal = Math.round((food.carb * 4 + food.pro * 4 + food.fat * 9) * multiplier);
                    return (
                      <div key={food.id} className="py-2.5 flex items-center justify-between text-xs gap-2">
                        <div>
                          <div className="font-semibold text-slate-800">{food.name} <span className="text-[10px] text-slate-400 font-normal">({food.portion})</span></div>
                          <div className="text-[10px] text-slate-500 space-x-2 mt-0.5">
                            <span className="text-amber-700">碳{(food.carb * multiplier).toFixed(0)}g</span>
                            <span className="text-sky-700">蛋{(food.pro * multiplier).toFixed(0)}g</span>
                            <span className="text-rose-700">脂{(food.fat * multiplier).toFixed(0)}g</span>
                            <span className="font-bold text-slate-700">≈ {estCal} kcal</span>
                          </div>
                        </div>
                        <button type="button" onClick={() => addFromDB(food)} className="bg-indigo-50 text-indigo-600 px-2.5 py-1.5 rounded-lg hover:bg-indigo-600 hover:text-white font-semibold text-xs shrink-0">+ 添加</button>
                      </div>
                    );
                  })}
                </div>
              </div>

              <form onSubmit={handleCustomAdd} className="border-t border-slate-100 pt-3 grid grid-cols-5 gap-1.5 text-xs">
                <input type="text" placeholder="自定义餐名" value={customFood.name} onChange={e => setCustomFood({...customFood, name: e.target.value})} className="col-span-2 border border-slate-300 rounded-lg px-2.5 py-1.5" />
                <input type="number" step="0.1" placeholder="碳(g)" value={customFood.carb} onChange={e => setCustomFood({...customFood, carb: e.target.value})} className="border border-slate-300 rounded-lg px-2 py-1.5" />
                <input type="number" step="0.1" placeholder="蛋(g)" value={customFood.pro} onChange={e => setCustomFood({...customFood, pro: e.target.value})} className="border border-slate-300 rounded-lg px-2 py-1.5" />
                <div className="flex gap-1">
                  <input type="number" step="0.1" placeholder="脂" value={customFood.fat} onChange={e => setCustomFood({...customFood, fat: e.target.value})} className="w-full border border-slate-300 rounded-lg px-1.5 py-1.5" />
                  <button type="submit" className="bg-slate-900 text-white font-bold rounded-lg px-2.5 py-1.5 shrink-0">+</button>
                </div>
              </form>

              {meals.length > 0 && (
                <div className="border-t border-slate-100 pt-3">
                  <div className="flex justify-between items-center text-xs mb-1.5 font-bold">
                    <span className="text-slate-700">今日已录餐品 ({meals.length}项 · 共 {totals.cal} kcal)</span>
                    <button type="button" onClick={() => updateDayRecord(r => ({ ...r, meals: [] }))} className="text-rose-600 font-normal">清空</button>
                  </div>
                  <div className="max-h-32 overflow-y-auto space-y-1">
                    {meals.map(m => (
                      <div key={m.id} className="bg-slate-50 px-2.5 py-1.5 text-xs flex justify-between items-center rounded-lg">
                        <span className="text-slate-700 font-medium truncate max-w-[180px]">{m.name}</span>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className="text-[10px] text-slate-400">碳{m.carb}/蛋{m.pro}/脂{m.fat}</span>
                          <span className="font-bold text-indigo-700">{m.cal} kcal</span>
                          <button type="button" onClick={() => updateDayRecord(r => ({ ...r, meals: r.meals.filter(x => x.id !== m.id) }))} className="text-slate-400 hover:text-rose-600 px-1">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <button type="button" onClick={() => setCurrentStep(3)} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-indigo-700 transition">下一步：🚴 运动热量抵消 ▶</button>
            </div>
          )}

          {currentStep === 3 && (
            <div key="step-3" className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2.5">
                <div>
                  <h2 className="text-sm font-black text-slate-800">🚴 第 3 步：运动抵消计算与打卡</h2>
                  <p className="text-[11px] text-slate-400">按你当前体重 ({activeWeight}kg) 测算需要运动多久</p>
                </div>
                <div className="flex items-center gap-1 text-[11px]">
                  {['全部', '有氧', '无氧'].map(t => (
                    <button key={t} type="button" onClick={() => setExFilter(t)} className={`px-2.5 py-1 rounded-full font-medium ${exFilter === t ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600'}`}>{t}</button>
                  ))}
                </div>
              </div>
              <div className="bg-indigo-50/60 p-3 rounded-xl space-y-2 text-xs">
                <div className="flex items-center justify-between text-indigo-950 font-bold">
                  <span>选择单次打卡时长:</span>
                  <div className="flex gap-1">
                    {[20, 30, 45, 60].map(m => (
                      <button key={m} type="button" onClick={() => setLogDuration(m)} className={`px-2 py-0.5 rounded font-medium ${logDuration === m ? 'bg-emerald-600 text-white' : 'bg-white border border-indigo-200'}`}>{m}分钟</button>
                    ))}
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-1.5 pt-1">
                  <span className="text-slate-500">抵消换算基准:</span>
                  <button type="button" onClick={() => setOffsetMode('smart')} className={`px-2 py-0.5 rounded transition ${offsetMode === 'smart' ? 'bg-indigo-600 text-white font-medium' : 'bg-white'}`}>
                    {calDiff < 0 ? `抵消今日超标 (${Math.abs(calDiff)} kcal)` : '额外刷脂 400 kcal'}
                  </button>
                  <button type="button" onClick={() => setOffsetMode('all')} className={`px-2 py-0.5 rounded transition ${offsetMode === 'all' ? 'bg-indigo-600 text-white font-medium' : 'bg-white'}`}>
                    抵消今日已吃 ({totals.cal} kcal)
                  </button>
                </div>
              </div>
              <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                {filteredExercises.map(ex => {
                  const calPerMin = (ex.met * 3.5 * activeWeight) / 200;
                  const neededMins = Math.ceil(targetBurnCal / calPerMin);
                  const burnInSelectedMins = Math.round(calPerMin * logDuration);
                  return (
                    <div key={ex.id} className="border border-slate-200/80 rounded-xl p-3 flex items-center justify-between gap-2 bg-slate-50/40 text-xs">
                      <div className="space-y-0.5">
                        <div className="flex items-center gap-1.5">
                          <span className="font-bold text-slate-800">{ex.name}</span>
                          <span className={`text-[10px] px-1.5 py-0.5 rounded font-semibold ${ex.type === '有氧' ? 'bg-emerald-50 text-emerald-700' : 'bg-purple-50 text-purple-700'}`}>{ex.type}</span>
                        </div>
                        <div className="text-[11px] text-slate-500">消耗 {targetBurnCal} kcal 需 <strong className="text-indigo-600">{neededMins} 分钟</strong></div>
                      </div>
                      <button type="button" onClick={() => logExercise(ex, logDuration)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg font-bold text-[11px] shrink-0">+ 打卡{logDuration}分 (-{burnInSelectedMins}k)</button>
                    </div>
                  );
                })}
              </div>
              {workouts.length > 0 && (
                <div className="bg-emerald-50/70 border border-emerald-200 p-3 rounded-xl space-y-1">
                  <div className="flex justify-between items-center text-xs font-bold text-emerald-950">
                    <span>今日已打卡运动 (共消耗 {burnedCalories} kcal)</span>
                    <button type="button" onClick={() => updateDayRecord(r => ({ ...r, workouts: [] }))} className="text-rose-600 font-normal">清空</button>
                  </div>
                  {workouts.map(w => (
                    <div key={w.id} className="text-xs flex justify-between items-center py-1">
                      <span className="text-slate-700">[{w.type}] {w.name} · {w.mins}分钟</span>
                      <div className="flex gap-2 font-bold text-emerald-700">
                        <span>-{w.cal} kcal</span>
                        <button type="button" onClick={() => updateDayRecord(r => ({ ...r, workouts: r.workouts.filter(x => x.id !== w.id) }))} className="text-slate-400 font-normal">✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <button type="button" onClick={() => setCurrentStep(4)} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-indigo-700 transition">下一步：📈 查看周期趋势图 ▶</button>
            </div>
          )}

          {currentStep === 4 && (
            <div key="step-4" className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2.5">
                <h2 className="text-sm font-black text-slate-800">📈 第 4 步：周期热量缺口与体重趋势</h2>
                <div className="flex bg-slate-100 p-0.5 rounded-lg text-xs">
                  {[7, 14].map(r => (
                    <button key={r} type="button" onClick={() => setTrendRange(r)} className={`px-2.5 py-1 rounded-md ${trendRange === r ? 'bg-white text-slate-900 shadow-sm font-bold' : 'text-slate-500'}`}>近 {r} 天</button>
                  ))}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2 text-xs text-center">
                <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200/60">
                  <span className="text-slate-400 block text-[11px]">周期累计热量缺口</span>
                  <span className={`text-sm font-bold ${trendSummary.totalDeficit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    {trendSummary.totalDeficit >= 0 ? `-${trendSummary.totalDeficit}` : `+${Math.abs(trendSummary.totalDeficit)}`} kcal
                  </span>
                </div>
                <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200/60">
                  <span className="text-slate-400 block text-[11px]">周期体重净变化</span>
                  <span className={`text-sm font-bold ${trendSummary.weightDiff <= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>
                    {trendSummary.weightDiff > 0 ? `+${trendSummary.weightDiff}` : trendSummary.weightDiff} kg
                  </span>
                </div>
              </div>
              <div className="space-y-4">
                <div className="space-y-1">
                  <span className="text-xs text-slate-600 font-semibold block">每日热量缺口柱状图 (点击柱条可切换日期)</span>
                  <div className="h-32 flex items-end justify-between gap-1 pb-1 pt-4 border-b border-slate-200 px-2 bg-slate-50/60 rounded-xl">
                    {trendSeries.map(d => {
                      const isSelected = d.date === selectedDate, hasData = d.deficit !== null, isDeficit = hasData && d.deficit >= 0;
                      const barHeightPct = hasData ? Math.min(100, Math.max(12, Math.round((Math.abs(d.deficit) / maxAbsDeficit) * 100))) : 8;
                      return (
                        <div key={d.date} onClick={() => setSelectedDate(d.date)} className="flex-1 flex flex-col items-center cursor-pointer">
                          <span className="text-[9px] text-slate-500 mb-0.5">{hasData ? (isDeficit ? `-${d.deficit}` : `+${Math.abs(d.deficit)}`) : '-'}</span>
                          <div className="w-full h-16 flex items-end justify-center">
                            <div style={{ height: `${barHeightPct}%` }} className={`w-full max-w-[18px] rounded-t transition-all ${!hasData ? 'bg-slate-200' : isDeficit ? 'bg-emerald-500' : 'bg-rose-500'} ${isSelected ? 'ring-2 ring-indigo-600' : ''}`} />
                          </div>
                          <span className={`text-[9px] mt-1 ${isSelected ? 'font-bold text-indigo-700 underline' : 'text-slate-500'}`}>{d.shortDate}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div className="space-y-1">
                  <span className="text-xs text-slate-600 font-semibold block">每日体重趋势折线 (kg)</span>
                  <div className="w-full overflow-hidden bg-slate-50/60 rounded-xl border border-slate-100">
                    <svg viewBox="0 0 520 140" className="w-full h-32 select-none">
                      <line x1={28} y1={22} x2={492} y2={22} stroke="#e2e8f0" strokeDasharray="3 3" />
                      <line x1={28} y1={70} x2={492} y2={70} stroke="#e2e8f0" strokeDasharray="3 3" />
                      <line x1={28} y1={118} x2={492} y2={118} stroke="#cbd5e1" />
                      {weightPoints.length > 1 && <polyline fill="none" stroke="#4f46e5" strokeWidth="2.5" points={weightPoints.map(p => `${p.x},${p.y}`).join(' ')} />}
                      {weightPoints.map(p => {
                        const isSelected = p.date === selectedDate;
                        return (
                          <g key={p.date} onClick={() => setSelectedDate(p.date)} className="cursor-pointer">
                            <circle cx={p.x} cy={p.y} r={isSelected ? 6 : 4} fill={isSelected ? '#4f46e5' : '#ffffff'} stroke="#4f46e5" strokeWidth={isSelected ? 3 : 2} />
                            <text x={p.x} y={p.y - 9} textAnchor="middle" fontSize="10" fontWeight={isSelected ? 'bold' : 'normal'} fill="#312e81">{p.weight}</text>
                            <text x={p.x} y={135} textAnchor="middle" fontSize="9" fill="#64748b">{p.shortDate}</text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>
                </div>
              </div>
              <div className="flex gap-2">
                <button type="button" onClick={exportHistoryCSV} className="flex-1 bg-slate-900 text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-slate-800">📥 导出 CSV 报表</button>
                <button type="button" onClick={() => setCurrentStep(5)} className="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-indigo-700">下一步：🏆 今日终极结算 ▶</button>
              </div>
            </div>
          )}

          {currentStep === 5 && (
            <div key="step-5" className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-2.5">
                <h2 className="text-base font-black text-slate-800">🏆 第 5 步：当日终极结算与规划</h2>
                <span className="text-xs text-indigo-600 font-semibold">{selectedDate}</span>
              </div>
              <div className="bg-gradient-to-br from-indigo-900 to-slate-900 text-white p-5 rounded-2xl space-y-4 shadow-md">
                <div className="flex justify-between items-center text-xs text-indigo-200 border-b border-indigo-800/80 pb-3">
                  <span>📅 结算日: {selectedDate}</span>
                  <span className="bg-indigo-500 text-white px-2.5 py-0.5 rounded-full font-bold">当日体重 {activeWeight} kg</span>
                </div>
                <div className="grid grid-cols-2 gap-4 text-center">
                  <div><span className="text-[11px] text-indigo-300 block">日常代谢总消耗 (TDEE)</span><span className="text-xl font-bold">{targets.tdee} <small className="text-xs">kcal</small></span></div>
                  <div className="border-l border-indigo-800/80"><span className="text-[11px] text-emerald-400 block">运动额外抵消</span><span className="text-xl font-bold text-emerald-400">+{burnedCalories} <small className="text-xs">kcal</small></span></div>
                  <div className="border-t border-indigo-800/80 pt-3"><span className="text-[11px] text-indigo-300 block">今日饮食总摄入</span><span className="text-xl font-bold">{totals.cal} <small className="text-xs">kcal</small></span></div>
                  <div className="border-t border-l border-indigo-800/80 pt-3">
                    <span className="text-[11px] text-indigo-200 block font-bold">最终造成热量缺口</span>
                    <span className={`text-xl font-black ${actualDeficit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {actualDeficit >= 0 ? `-${actualDeficit}` : `+${Math.abs(actualDeficit)}`} <small className="text-xs font-bold">kcal</small>
                    </span>
                    <span className="text-[10px] text-indigo-300 block mt-0.5">预计周变化：{actualDeficit >= 0 ? `-${weeklyWeightChangeKg}` : `+${Math.abs(weeklyWeightChangeKg)}`} kg/周</span>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-2 border-t border-indigo-800/60 pt-3.5 text-center text-xs">
                  <div className="bg-indigo-950/60 p-2 rounded-lg"><span className="text-amber-400 block font-bold">碳水化合物</span><span className="text-sm font-bold block mt-0.5">{totals.carb} / {targets.carb}g</span></div>
                  <div className="bg-indigo-950/60 p-2 rounded-lg"><span className="text-sky-400 block font-bold">蛋白质</span><span className="text-sm font-bold block mt-0.5">{totals.pro} / {targets.pro}g</span></div>
                  <div className="bg-indigo-950/60 p-2 rounded-lg"><span className="text-rose-400 block font-bold">脂肪</span><span className="text-sm font-bold block mt-0.5">{totals.fat} / {targets.fat}g</span></div>
                </div>
              </div>
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs space-y-1.5">
                <div className="font-bold text-slate-800">📌 系统自动复盘与明日建议：</div>
                <p className="text-slate-600 leading-relaxed">
                  {actualDeficit >= 300 ? `✅ 今日创造了 ${actualDeficit} kcal 的理想减脂缺口！` : actualDeficit >= 0 ? `⚖️ 今日热量基本收支平衡（微缺口 ${actualDeficit} kcal），若想加快减脂，明日可增加 30 分钟坡度走或慢跑。` : `⚠️ 今日热量盈余 ${Math.abs(actualDeficit)} kcal，建议今晚或明天安排 40 分钟有氧+力量训练抵消，明日主食减半并多喝无糖茶水排钠。`}
                  {totals.pro < targets.pro * 0.8 ? ` 另外今日蛋白质摄入偏低（差 ${(targets.pro - totals.pro).toFixed(0)}g），明天建议补充即食鸡胸肉、温泉蛋或无糖豆浆以防掉肌肉。` : ''}
                </p>
              </div>
              <div className="border-t border-slate-100 pt-3.5 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-800">🤖 AI 营养师深度复盘与明日三餐/运动安排</span>
                  <button type="button" onClick={handleGetAiAdvice} disabled={aiAdviceLoading} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-bold px-3 py-1.5 rounded-lg text-xs">
                    {aiAdviceLoading ? '⏳ 正在生成规划...' : '✨ 生成 AI 明日规划'}
                  </button>
                </div>
                {aiAdvice && <div className="bg-indigo-50/60 border border-indigo-200 p-4 rounded-xl text-xs text-slate-700 leading-relaxed whitespace-pre-line">{aiAdvice}</div>}
              </div>
            </div>
          )}

          <div className="flex items-center justify-between pt-2 text-xs">
            <button type="button" onClick={() => setCurrentStep(prev => Math.max(1, prev - 1))} disabled={currentStep === 1} className="text-slate-600 disabled:opacity-30 border border-slate-200 rounded-xl px-4 py-2 bg-white font-medium">◀ 上一页</button>
            <span className="text-slate-400 font-semibold">第 {currentStep} / 5 页</span>
            <button type="button" onClick={() => setCurrentStep(prev => Math.min(5, prev + 1))} disabled={currentStep === 5} className="bg-slate-900 text-white disabled:opacity-30 font-bold rounded-xl px-4 py-2">下一页 ▶</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><MacroTrackerApp /></ErrorBoundary>);
  </script>
</body>
</html>

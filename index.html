    const getLocalDateStr = (dateObj = new Date()) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

      dt.setDate(dt.getDate() + days);
      return getLocalDateStr(dt);
    };

    const GOAL_CONFIGS = {
      cut:      { label: '减脂 (-20% 热量缺口)', calMulti: 0.80, carbRatio: 0.40, proRatio: 0.35, fatRatio: 0.25 },
      maintain: { label: '维持体重 (平热量 TDEE)', calMulti: 1.00, carbRatio: 0.45, proRatio: 0.30, fatRatio: 0.25 },
      bulk:     { label: '增肌 (+10% 热量盈余)', calMulti: 1.10, carbRatio: 0.50, proRatio: 0.25, fatRatio: 0.25 },
      lowcarb:  { label: '控碳刷脂 (-15% 热量缺口)', calMulti: 0.85, carbRatio: 0.25, proRatio: 0.40, fatRatio: 0.35 }
    };

    function MacroTrackerApp() {
      const todayStr = getLocalDateStr();
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [trendRange, setTrendRange] = useState(7);

      // 跨设备同步面板开关与状态
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [importMode, setImportMode] = useState('merge'); // merge(智能合并) | overwrite(完全覆盖)
      const [syncCodeInput, setSyncCodeInput] = useState('');
      const [syncNotice, setSyncNotice] = useState('');
      const fileInputRef = useRef(null);

      // 用户基础档案
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('macro_profile_v4');
        return saved ? JSON.parse(saved) : {
          gender: 'male', age: 26, height: 175, weight: 70, activity: 1.375, goal: 'cut'
        };
      });

      // 按日期存储的完整历史记录字典
      const [historyDB, setHistoryDB] = useState(() => {
        const saved = localStorage.getItem('macro_history_v5');
        if (saved) return JSON.parse(saved);

        const oldMeals = JSON.parse(localStorage.getItem('macro_meals_v4') || '[]');
        const oldWorkouts = JSON.parse(localStorage.getItem('macro_workouts_v4') || '[]');
        const oldProf = JSON.parse(localStorage.getItem('macro_profile_v4') || '{"weight":70}');

        if (oldMeals.length > 0 || oldWorkouts.length > 0) {
          return {
            [todayStr]: {
              weight: Number(oldProf.weight) || 70,
              meals: oldMeals,
              workouts: oldWorkouts
            }
          };
        }
        return {};
      });

      const [activeCategory, setActiveCategory] = useState('全部');
      const [searchQuery, setSearchQuery] = useState('');
      const [multiplier, setMultiplier] = useState(1);
      const [customFood, setCustomFood] = useState({ name: '', carb: '', pro: '', fat: '' });

      const [exFilter, setExFilter] = useState('全部');
      const [offsetMode, setOffsetMode] = useState('smart');
      const [logDuration, setLogDuration] = useState(30);

      useEffect(() => {
        localStorage.setItem('macro_profile_v4', JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem('macro_history_v5', JSON.stringify(historyDB));
      }, [historyDB]);

      const currentDayData = historyDB[selectedDate] || {
        weight: profile.weight,
        meals: [],
        workouts: []
      };

      const meals = currentDayData.meals || [];
      const workouts = currentDayData.workouts || [];
      const activeWeight = Number(currentDayData.weight ?? profile.weight) || 70;

      const updateDayRecord = (updater) => {
        setHistoryDB(prev => {
          const existing = prev[selectedDate] || { weight: profile.weight, meals: [], workouts: [] };
          const updated = updater(existing);
          return { ...prev, [selectedDate]: updated };
        });
      };

      const handleDayWeightChange = (val) => {
        if (selectedDate === todayStr) {
          setProfile(p => ({ ...p, weight: val }));
        }
        updateDayRecord(rec => ({ ...rec, weight: val }));
      };

      const calcTdeeForWeight = (w) => {
        const { gender, age, height, activity } = profile;
        let bmr = (10 * (Number(w) || 70)) + (6.25 * (Number(height) || 175)) - (5 * (Number(age) || 26));
        bmr += gender === 'male' ? 5 : -161;
        return {
          bmr: Math.round(bmr),
          tdee: Math.round(bmr * Number(activity))
        };
      };

      const targets = useMemo(() => {
        const { bmr, tdee } = calcTdeeForWeight(activeWeight);
        const cfg = GOAL_CONFIGS[profile.goal];
        const cal = Math.round(tdee * cfg.calMulti);

        return {
          bmr,
          tdee,
          cal,
          plannedDeficit: Math.round(tdee - cal),
          carb: Math.round((cal * cfg.carbRatio) / 4),
          pro: Math.round((cal * cfg.proRatio) / 4),
          fat: Math.round((cal * cfg.fatRatio) / 9)
        };
      }, [profile, activeWeight]);

      const totals = useMemo(() => {
        return meals.reduce((acc, item) => ({
          carb: +(acc.carb + item.carb).toFixed(1),
          pro: +(acc.pro + item.pro).toFixed(1),
          fat: +(acc.fat + item.fat).toFixed(1),
          cal: Math.round(acc.cal + item.cal)
        }), { carb: 0, pro: 0, fat: 0, cal: 0 });
      }, [meals]);

      const burnedCalories = useMemo(() => {
        return workouts.reduce((sum, w) => sum + w.cal, 0);
      }, [workouts]);

      const effectiveTargetCal = targets.cal + burnedCalories;
      const calDiff = effectiveTargetCal - totals.cal;
      const actualDeficit = (targets.tdee + burnedCalories) - totals.cal;
      const weeklyWeightChangeKg = ((actualDeficit * 7) / 7700).toFixed(2);

      // 生成过去 N 天趋势序列
      const trendSeries = useMemo(() => {
        const days = [];
        let lastKnownWeight = Number(profile.weight) || 70;

        for (let i = trendRange - 1; i >= 0; i--) {
          const dStr = shiftDateStr(selectedDate, -i);
          const rec = historyDB[dStr];
          const hasMealsOrWorkouts = rec && ((rec.meals && rec.meals.length > 0) || (rec.workouts && rec.workouts.length > 0));
          const hasWeight = rec && rec.weight !== undefined && rec.weight !== '';

          if (hasWeight) {
            lastKnownWeight = Number(rec.weight);
          }

          const dayWeight = hasWeight ? Number(rec.weight) : lastKnownWeight;
          const { tdee } = calcTdeeForWeight(dayWeight);
          const intake = rec?.meals ? rec.meals.reduce((s, m) => s + m.cal, 0) : 0;
          const burned = rec?.workouts ? rec.workouts.reduce((s, w) => s + w.cal, 0) : 0;
          const deficit = hasMealsOrWorkouts ? (tdee + burned - intake) : null;

          days.push({
            date: dStr,
            shortDate: dStr.slice(5),
            weight: dayWeight,
            hasWeight,
            hasMealsOrWorkouts,
            intake,
            burned,
            tdee,
            deficit
          });
        }
        return days;
      }, [historyDB, selectedDate, trendRange, profile]);

      const trendSummary = useMemo(() => {
        const activeDays = trendSeries.filter(d => d.deficit !== null);
        const totalDeficit = activeDays.reduce((s, d) => s + d.deficit, 0);
        const estFatLossKg = (totalDeficit / 7700).toFixed(2);

        const weights = trendSeries.map(d => d.weight);
        const firstW = weights[0] || activeWeight;
        const lastW = weights[weights.length - 1] || activeWeight;
        const weightDiff = +(lastW - firstW).toFixed(2);

        return {
          recordedCount: activeDays.length,
          totalDeficit,
          estFatLossKg,
          weightDiff
        };
      }, [trendSeries, activeWeight]);

      const targetBurnCal = useMemo(() => {
        if (offsetMode === 'all') return Math.max(100, totals.cal);
        if (offsetMode === 'd300') return 300;
        if (offsetMode === 'd500') return 500;
        return calDiff < 0 ? Math.abs(calDiff) : 400;
      }, [offsetMode, totals.cal, calDiff]);

      const filteredDB = useMemo(() => {
        return ASIAN_FOOD_DB.filter(item => {
          const matchCat = activeCategory === '全部' || item.category === activeCategory;
          const matchQuery = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             item.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchQuery;
        });
      }, [activeCategory, searchQuery]);

      const filteredExercises = useMemo(() => {
        return EXERCISE_DB.filter(ex => exFilter === '全部' || ex.type === exFilter);
      }, [exFilter]);

      const addFromDB = (food) => {
        const m = Number(multiplier) || 1;
        const carb = +(food.carb * m).toFixed(1);
        const pro = +(food.pro * m).toFixed(1);
        const fat = +(food.fat * m).toFixed(1);
        const cal = Math.round(carb * 4 + pro * 4 + fat * 9);
        const label = m === 1 ? food.name : `${food.name} (${m}x)`;

        updateDayRecord(rec => ({
          ...rec,
          meals: [{ id: Date.now() + Math.random(), name: label, carb, pro, fat, cal }, ...(rec.meals || [])]
        }));
      };

      const handleCustomAdd = (e) => {
        e.preventDefault();
        const carb = Math.max(0, parseFloat(customFood.carb) || 0);
        const pro = Math.max(0, parseFloat(customFood.pro) || 0);
        const fat = Math.max(0, parseFloat(customFood.fat) || 0);
        if (carb === 0 && pro === 0 && fat === 0) return;

        const cal = Math.round(carb * 4 + pro * 4 + fat * 9);
        updateDayRecord(rec => ({
          ...rec,
          meals: [{
            id: Date.now(),
            name: customFood.name.trim() || '自定义餐品',
            carb, pro, fat, cal
          }, ...(rec.meals || [])]
        }));

        setCustomFood({ name: '', carb: '', pro: '', fat: '' });
      };

      const logExercise = (ex, customMinutes) => {
        const mins = Math.max(1, Number(customMinutes) || Number(logDuration) || 30);
        const calPerMin = (ex.met * 3.5 * activeWeight) / 200;
        const burned = Math.round(calPerMin * mins);

        updateDayRecord(rec => ({
          ...rec,
          workouts: [
            { id: Date.now() + Math.random(), name: ex.name, type: ex.type, mins, cal: burned },
            ...(rec.workouts || [])
          ]
        }));
      };

      // ==================== 新增：JSON 导出 / 导入与同步码逻辑 ====================
      const buildBackupPayload = () => ({
        version: 'v6',
        exportedAt: new Date().toISOString(),
        profile,
        historyDB
      });

      // 1. 下载 .json 备份文件
      const downloadJsonBackup = () => {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `macro_tracker_backup_${todayStr}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setSyncNotice('✅ 已下载 .json 备份文件！可发送至手机或电脑导入。');
      };

      // 2. 一键复制 Base64 同步码（方便微信/备忘录直接发给手机）
      const copySyncString = async () => {
        try {
          const payload = buildBackupPayload();
          const encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
          await navigator.clipboard.writeText(encoded);
          setSyncNotice('✅ 同步码已复制到剪贴板！可直接通过微信或备忘录发送到另一台设备粘贴恢复。');
        } catch (err) {
          setSyncNotice('❌ 复制失败，请尝试使用下载 .json 文件方式备份。');
        }
      };

      // 核心合并/还原函数
      const applyImportedPayload = (parsed) => {
        if (!parsed || typeof parsed !== 'object' || (!parsed.historyDB && !parsed.profile)) {
          throw new Error('无效的备份数据格式');
        }

        if (parsed.profile) {
          setProfile(prev => ({ ...prev, ...parsed.profile }));
        }

        if (parsed.historyDB && typeof parsed.historyDB === 'object') {
          if (importMode === 'overwrite') {
            setHistoryDB(parsed.historyDB);
          } else {
            // 智能合并模式：按日期合并，同一天内按 id 去重合并餐品与运动
            setHistoryDB(prev => {
              const merged = { ...prev };
              Object.entries(parsed.historyDB).forEach(([dateKey, incomingDay]) => {
                if (!merged[dateKey]) {
                  merged[dateKey] = incomingDay;
                } else {
                  const curDay = merged[dateKey];
                  const curMeals = curDay.meals || [];
                  const incMeals = incomingDay.meals || [];
                  const existingMealIds = new Set(curMeals.map(m => m.id));
                  const mergedMeals = [...curMeals, ...incMeals.filter(m => !existingMealIds.has(m.id))];

                  const curWorkouts = curDay.workouts || [];
                  const incWorkouts = incomingDay.workouts || [];
                  const existingWorkoutIds = new Set(curWorkouts.map(w => w.id));
                  const mergedWorkouts = [...curWorkouts, ...incWorkouts.filter(w => !existingWorkoutIds.has(w.id))];

                  merged[dateKey] = {
                    weight: incomingDay.weight ?? curDay.weight,
                    meals: mergedMeals,
                    workouts: mergedWorkouts
                  };
                }
              });
              return merged;
            });
          }
        }

        const importedDaysCount = parsed.historyDB ? Object.keys(parsed.historyDB).length : 0;
        setSyncNotice(`🎉 同步成功！已${importMode === 'merge' ? '智能合并' : '完全覆盖'} ${importedDaysCount} 天的历史记录与个人参数。`);
        setSyncCodeInput('');
      };

      // 3. 从上传的 .json 文件恢复
      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            applyImportedPayload(parsed);
          } catch (err) {
            setSyncNotice('❌ JSON 文件解析失败，请确认文件是否正确。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      // 4. 从粘贴的同步码或 JSON 文本恢复
      const handleSyncCodeRestore = () => {
        const raw = syncCodeInput.trim();
        if (!raw) return;
        try {
          let parsed;
          if (raw.startsWith('{')) {
            parsed = JSON.parse(raw);
          } else {
            const decoded = decodeURIComponent(atob(raw));
            parsed = JSON.parse(decoded);
          }
          applyImportedPayload(parsed);
        } catch (err) {
          setSyncNotice('❌ 同步码解析失败，请确认复制了完整的同步码或 JSON 文本。');
        }
      };

      // 导出 CSV 报表
      const exportHistoryCSV = () => {
        const sortedDates = Object.keys(historyDB).sort();
        if (sortedDates.length === 0) {
          alert('暂无历史打卡记录可导出，请先添加餐品或运动！');
          return;

        const headers = ['日期', '当日体重(kg)', '基础消耗TDEE(kcal)', '饮食摄入(kcal)', '碳水(g)', '蛋白质(g)', '脂肪(g)', '运动消耗(kcal)', '真实热量缺口(kcal)', '餐单与运动摘要'];
        const rows = sortedDates.map(d => {
          const rec = historyDB[d];
          const w = Number(rec.weight || profile.weight) || 70;
          const { tdee } = calcTdeeForWeight(w);
          const mList = rec.meals || [];
          const wList = rec.workouts || [];
          const intake = mList.reduce((s, i) => s + i.cal, 0);
          const carb = mList.reduce((s, i) => s + i.carb, 0).toFixed(1);
          const pro = mList.reduce((s, i) => s + i.pro, 0).toFixed(1);
          const fat = mList.reduce((s, i) => s + i.fat, 0).toFixed(1);
          const burned = wList.reduce((s, i) => s + i.cal, 0);
          const deficit = tdee + burned - intake;
          const summary = [
            ...mList.map(m => m.name),
            ...wList.map(x => `[运动]${x.name}${x.mins}分`)
          ].join(' | ').replace(/,/g, '，');

          return [d, w, tdee, intake, carb, pro, fat, burned, deficit, `"${summary}"`].join(',');
        });

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `膳食与运动历史报告_${todayStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const categories = [
        '全部',
        '川味面点/抄手',
        '川菜/江湖菜',
        '川渝小吃/卤味',
        '巴蜀零食/糕点',
        '川渝茶饮/特饮',
        '食阁/熟食',
        '中式/夜市',
        '日韩料理',
        '便利店',
        '手摇饮/咖啡',
        '亚洲甜品/烘焙'
      ];

      return (
        <div className="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
          {/* 顶部栏 + 日期切换 + 跨设备同步入口 */}
          <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-slate-200 pb-4">
            <div>
              <div className="flex flex-wrap items-center gap-2">
                <h1 className="text-2xl font-bold text-slate-900">膳食营养与运动热量抵消追踪器</h1>
                <span className="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-0.5 rounded-full border border-indigo-200">
                  v6 跨设备同步版
                </span>
              </div>
              <p className="text-sm text-slate-500 mt-1">支持手机与电脑一键互传备份、日历归档、热量缺口与体重折线趋势</p>
            </div>

            <div className="flex flex-wrap items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200/90">
              <button
                onClick={() => setSelectedDate(shiftDateStr(selectedDate, -1))}
                className="px-2.5 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition"
              >
                ◀ 前一天
              </button>

              <div className="flex items-center gap-1.5 px-1">
                <input
                  type="date"
                  value={selectedDate}
                  onChange={e => e.target.value && setSelectedDate(e.target.value)}
                  className="text-sm font-bold text-indigo-700 bg-indigo-50/60 border border-indigo-200 rounded-lg px-2.5 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <button
                onClick={() => setSelectedDate(shiftDateStr(selectedDate, 1))}
                className="px-2.5 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition"
              >
                后一天 ▶
              </button>

              {selectedDate !== todayStr && (
                <button
                  onClick={() => setSelectedDate(todayStr)}
                  className="px-2.5 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition"
                >
                  今天
                </button>
              )}

              <button
                onClick={() => { setShowSyncModal(!showSyncModal); setSyncNotice(''); }}
                className="px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition flex items-center gap-1"
              >
                ☁️ 跨设备同步 / 备份
              </button>

              <button
                onClick={() => updateDayRecord(rec => ({ ...rec, meals: [], workouts: [] }))}
                className="text-xs text-rose-600 hover:bg-rose-50 border border-rose-200 px-2.5 py-1.5 rounded-lg transition font-medium"
              >
                清空本日
              </button>
            </div>
          </header>

          {/* 跨设备同步与 JSON 备份展开面板 */}
          {showSyncModal && (
            <section className="bg-indigo-950 text-white p-5 md:p-6 rounded-2xl shadow-md space-y-4 border border-indigo-800">
              <div className="flex items-center justify-between border-b border-indigo-800/80 pb-3">
                <div>
                  <h2 className="text-base font-bold flex items-center gap-2">
                    ☁️ 手机 ↔ 电脑跨设备历史数据同步中心
                    <span className="text-xs font-normal bg-indigo-800 text-indigo-200 px-2 py-0.5 rounded-full">
                      当前已存 {Object.keys(historyDB).length} 天记录
                    </span>
                  </h2>
                  <p className="text-xs text-indigo-300 mt-0.5">

                  </p>
                </div>
                <button
                  onClick={() => setShowSyncModal(false)}
                  className="text-xs text-indigo-300 hover:text-white px-2.5 py-1 rounded-lg border border-indigo-700"
                >
                  收起面板 ✕
                </button>
              </div>

              {syncNotice && (
                <div className="bg-indigo-900/90 border border-indigo-500 text-indigo-100 px-3.5 py-2.5 rounded-xl text-xs font-medium">
                  {syncNotice}
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {/* 导出区 */}
                <div className="bg-indigo-900/50 border border-indigo-800 p-4 rounded-xl space-y-3">
                  <div className="text-sm font-semibold text-indigo-100">第一步：从当前设备导出数据</div>
                  <p className="text-xs text-indigo-300">
                    手机端推荐使用「复制同步码」，直接发到微信文件传输助手；电脑端也可下载 `.json` 文件长期存档。
                  </p>
                  <div className="flex flex-wrap gap-2.5 pt-1">
                    <button

                <div className="bg-indigo-900/50 border border-indigo-800 p-4 rounded-xl space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-semibold text-indigo-100">第二步：在另一台设备导入恢复</span>
                    <div className="flex items-center gap-2 text-xs">

                      value={syncCodeInput}

                      className="flex-1 rounded-lg bg-indigo-950/90 border border-indigo-700 px-3 py-1.5 text-xs text-white placeholder-indigo-400 focus:outline-none focus:border-emerald-400"

                  </div>

                  <div className="flex items-center justify-between pt-1 border-t border-indigo-800/60 text-xs">
                    <span className="text-indigo-300">或者直接上传备份的 `.json` 文件：</span>
                    <input

                      accept=".json,application/json"

                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="bg-indigo-800 hover:bg-indigo-700 text-indigo-100 px-3 py-1 rounded-lg border border-indigo-600 transition"
                    >
                      📂 选择 .json 文件导入
                    </button>
                  </div>
                </div>
              </div>
            </section>
          )}

          {/* 历史热量缺口与体重变化趋势图 */}
          <TrendChartSection
            trendSeries={trendSeries}
            trendSummary={trendSummary}
            trendRange={trendRange}
            setTrendRange={setTrendRange}
            selectedDate={selectedDate}
            setSelectedDate={setSelectedDate}
            exportHistoryCSV={exportHistoryCSV}
          />

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* 左侧栏：身体参数 + 145项食物速查 */}
            <div className="lg:col-span-5 space-y-6">
              {/* 1. 身体参数与当日体重打卡 */}
              <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
                <div className="flex items-center justify-between border-b pb-2">
                  <h2 className="text-base font-semibold text-slate-800">1. 个人参数与当日体重</h2>
                  <span className="text-xs text-indigo-600 font-medium">{selectedDate}</span>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs text-slate-500 mb-1">性别</label>
                    <select
                      value={profile.gender}
                      onChange={e => setProfile({...profile, gender: e.target.value})}
                      className="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm"
                    >
                      <option value="male">男性</option>
                      <option value="female">女性</option>

                  <div>

                    <input

                    <input

                    <input

                      className="w-full rounded-lg border border-indigo-400 bg-indigo-50/40 px-3 py-1.5 text-sm font-bold text-indigo-900"
                    />
                  </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs text-slate-500 mb-1">日常活动量</label>
                    <select
                      value={profile.activity}
                      onChange={e => setProfile({...profile, activity: parseFloat(e.target.value)})}
                      className="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-sm"
                    >
                      <option value={1.2}>久坐办公</option>
                      <option value={1.375}>轻度运动 (1-3天/周)</option>

                  </div>
                  <div>

                    <select

    // 历史热量缺口柱状图 + 体重变化折线图组件
    function TrendChartSection({ trendSeries, trendSummary, trendRange, setTrendRange, selectedDate, setSelectedDate, exportHistoryCSV }) {
      const maxAbsDeficit = Math.max(
        600,
        ...trendSeries.map(d => (d.deficit !== null ? Math.abs(d.deficit) : 0))
      );

      const weights = trendSeries.map(d => d.weight);
      const minW = Math.min(...weights) - 0.8;
      const maxW = Math.max(...weights) + 0.8;
      const wSpan = Math.max(1.5, maxW - minW);

      const svgW = 520;
      const svgH = 140;
      const padX = 28;
      const padY = 22;
      const innerW = svgW - padX * 2;
      const innerH = svgH - padY * 2;

      const weightPoints = trendSeries.map((d, idx) => {
        const x = padX + (trendSeries.length === 1 ? innerW / 2 : (idx / (trendSeries.length - 1)) * innerW);
        const y = padY + innerH - ((d.weight - minW) / wSpan) * innerH;
        return { x, y, ...d };
      });

      const polylineStr = weightPoints.map(p => `${p.x},${p.y}`).join(' ');

      return (
        <section className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b pb-3">
            <div>
              <h2 className="text-base font-semibold text-slate-800">
                每日热量缺口与体重变化趋势 ({trendRange}天视图)
              </h2>
              <p className="text-xs text-slate-500">
                点击图表中任意日期柱条或节点，即可快速切换到该日查看或补录餐单
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <div className="flex bg-slate-100 p-0.5 rounded-lg text-xs">
                {[7, 14].map(r => (
                  <button
                    key={r}
                    onClick={() => setTrendRange(r)}
                    className={`px-2.5 py-1 rounded-md font-medium transition ${
                      trendRange === r ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'
                    }`}
                  >
                    近 {r} 天
                  </button>
                ))}
              </div>
              <button
                onClick={exportHistoryCSV}
                className="text-xs bg-slate-900 hover:bg-slate-800 text-white font-medium px-3 py-1.5 rounded-lg transition"
              >
                导出 CSV 报表
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200/70 text-xs text-center">
            <div>
              <span className="text-slate-500 block">本周期已打卡天数</span>
              <span className="text-sm font-bold text-slate-800">{trendSummary.recordedCount} / {trendRange} 天</span>
            </div>
            <div className="border-l border-slate-200">
              <span className="text-slate-500 block">周期累计热量缺口</span>
              <span className={`text-sm font-bold ${trendSummary.totalDeficit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                {trendSummary.totalDeficit >= 0 ? `-${trendSummary.totalDeficit}` : `+${Math.abs(trendSummary.totalDeficit)}`} kcal
              </span>
            </div>
            <div className="border-l border-slate-200">
              <span className="text-slate-500 block">缺口折算理论减脂</span>
              <span className={`text-sm font-bold ${trendSummary.totalDeficit >= 0 ? 'text-indigo-600' : 'text-rose-600'}`}>
                {trendSummary.totalDeficit >= 0 ? `-${trendSummary.estFatLossKg}` : `+${Math.abs(trendSummary.estFatLossKg)}`} kg
              </span>
            </div>
            <div className="border-l border-slate-200">
              <span className="text-slate-500 block">周期体重净变化</span>
              <span className={`text-sm font-bold ${trendSummary.weightDiff <= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>
                {trendSummary.weightDiff > 0 ? `+${trendSummary.weightDiff}` : trendSummary.weightDiff} kg
              </span>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pt-1">
            <div className="border border-slate-200/80 rounded-xl p-4 bg-slate-50/40 flex flex-col justify-between">
              <div className="flex items-center justify-between text-xs mb-2">
                <span className="font-semibold text-slate-700">每日真实热量缺口 / 盈余 (kcal)</span>
                <div className="flex items-center gap-3 text-[11px]">
                  <span className="flex items-center gap-1"><i className="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></i> 热量缺口(减脂)</span>
                  <span className="flex items-center gap-1"><i className="w-2.5 h-2.5 rounded-sm bg-rose-500 inline-block"></i> 热量超标(盈余)</span>
                </div>
              </div>

              <div className="h-36 flex items-end justify-between gap-1.5 pt-4 pb-1 px-1 border-b border-slate-200">
                {trendSeries.map(d => {
                  const isSelected = d.date === selectedDate;
                  const hasData = d.deficit !== null;
                  const isDeficit = hasData && d.deficit >= 0;
                  const barHeightPct = hasData ? Math.min(100, Math.max(12, Math.round((Math.abs(d.deficit) / maxAbsDeficit) * 100))) : 8;

                  return (
                    <div
                      key={d.date}
                      onClick={() => setSelectedDate(d.date)}
                      className="flex-1 flex flex-col items-center cursor-pointer group"
                      title={`${d.date}: ${hasData ? (isDeficit ? `热量缺口 -${d.deficit} kcal` : `热量盈余 +${Math.abs(d.deficit)} kcal`) : '未记录饮食'}`}
                    >
                      <span className="text-[10px] text-slate-500 mb-1 opacity-80 group-hover:opacity-100 font-medium">
                        {hasData ? (isDeficit ? `-${d.deficit}` : `+${Math.abs(d.deficit)}`) : '-'}
                      </span>
                      <div className="w-full h-20 flex items-end justify-center">
                        <div
                          style={{ height: `${barHeightPct}%` }}
                          className={`w-full max-w-[26px] rounded-t-md transition-all ${
                            !hasData
                              ? 'bg-slate-200'
                              : isDeficit
                              ? 'bg-emerald-500 group-hover:bg-emerald-600'
                              : 'bg-rose-500 group-hover:bg-rose-600'
                          } ${isSelected ? 'ring-2 ring-indigo-600 ring-offset-1' : ''}`}
                        />
                      </div>
                      <span className={`text-[10px] mt-1.5 ${isSelected ? 'font-bold text-indigo-700 underline' : 'text-slate-500'}`}>
                        {d.shortDate}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="border border-slate-200/80 rounded-xl p-4 bg-slate-50/40 flex flex-col justify-between">
              <div className="flex items-center justify-between text-xs mb-1">
                <span className="font-semibold text-slate-700">每日体重变化趋势折线 (kg)</span>
                <span className="text-[11px] text-slate-400">在面板 1 修改「当日体重」即可记录</span>
              </div>

              <div className="w-full overflow-hidden">
                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-36 select-none">
                  <line x1={padX} y1={padY} x2={svgW - padX} y2={padY} stroke="#e2e8f0" strokeDasharray="3 3" />
                  <line x1={padX} y1={svgH / 2} x2={svgW - padX} y2={svgH / 2} stroke="#e2e8f0" strokeDasharray="3 3" />
                  <line x1={padX} y1={svgH - padY} x2={svgW - padX} y2={svgH - padY} stroke="#cbd5e1" />

                  <polyline
                    fill="none"
                    stroke="#4f46e5"
                    strokeWidth="2.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    points={polylineStr}
                  />

                  {weightPoints.map(p => {
                    const isSelected = p.date === selectedDate;
                    return (
                      <g
                        key={p.date}
                        onClick={() => setSelectedDate(p.date)}
                        className="cursor-pointer"
                      >
                        <circle
                          cx={p.x}
                          cy={p.y}
                          r={isSelected ? 6 : 4}
                          fill={isSelected ? '#4f46e5' : p.hasWeight ? '#ffffff' : '#e2e8f0'}
                          stroke="#4f46e5"
                          strokeWidth={isSelected ? 3 : 2}
                        />
                        <text
                          x={p.x}
                          y={p.y - 9}
                          textAnchor="middle"
                          fontSize="10"
                          fontWeight={isSelected ? 'bold' : 'normal'}
                          fill={isSelected ? '#312e81' : '#475569'}
                        >
                          {p.weight}
                        </text>
                        <text
                          x={p.x}
                          y={svgH - 5}
                          textAnchor="middle"
                          fontSize="10"
                          fontWeight={isSelected ? 'bold' : 'normal'}
                          fill={isSelected ? '#4f46e5' : '#64748b'}
                        >
                          {p.shortDate}
                        </text>
                      </g>
                    );
                  })}
                </svg>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function MacroCard({ label, current, target, unit, calPerGram, colorClass }) {
      const pct = Math.min(100, Math.round((current / target) * 100)) || 0;
      const theme = {
        amber: { bg: 'bg-amber-50/70', border: 'border-amber-200/80', text: 'text-amber-900', sub: 'text-amber-700', barBg: 'bg-amber-200/60', bar: 'bg-amber-500' },
        sky:   { bg: 'bg-sky-50/70',   border: 'border-sky-200/80',   text: 'text-sky-900',   sub: 'text-sky-700',   barBg: 'bg-sky-200/60',   bar: 'bg-sky-500' },
        rose:  { bg: 'bg-rose-50/70',  border: 'border-rose-200/80',  text: 'text-rose-900',  sub: 'text-rose-700',  barBg: 'bg-rose-200/60',  bar: 'bg-rose-500' }
      }[colorClass];

      return (
        <div className={`${theme.bg} border ${theme.border} p-4 rounded-xl`}>
          <div className="flex justify-between items-center text-xs mb-1">
            <span className={`font-semibold ${theme.sub}`}>{label}</span>
            <span className="text-slate-400">{calPerGram} kcal/g</span>
          </div>
          <div className={`text-xl font-bold ${theme.text} mb-2`}>
            {current}<span className={`text-xs font-normal ${theme.sub}`}> / {target}{unit}</span>
          </div>
          <div className={`w-full h-1.5 ${theme.barBg} rounded-full overflow-hidden`}>
            <div className={`h-full ${theme.bar} transition-all duration-300`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MacroTrackerApp />);
  </script>
</body>
</html>

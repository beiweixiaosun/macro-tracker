name: 自动生成安卓APK安装包

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 一键调用官方引擎生成APK并自动完成数字签名
        run: |
          echo "正在通过官方云端引擎生成安卓包..."
          curl -s -X POST "https://pwabuilder-cloudapk.azurewebsites.net/generateAppPackage" \
            -H "Content-Type: application/json" \
            -d '{
              "packageId": "io.github.beiweixiaosun.twa",
              "name": "膳食追踪",
              "launcherName": "膳食追踪",
              "display": "standalone",
              "themeColor": "#4F46E5",
              "navigationColor": "#FFFFFF",
              "navigationColorDark": "#0F172A",
              "navigationDividerColor": "#E2E8F0",
              "navigationDividerColorDark": "#1E293B",
              "backgroundColor": "#F8FAFC",
              "enableNotifications": true,
              "startUrl": "/macro-tracker/index.html",
              "iconUrl": "https://cdn-icons-png.flaticon.com/512/3227/3227848.png",
              "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/3227/3227848.png",
              "appVersion": "1.0.0",
              "appVersionCode": 1,
              "signingMode": "new",
              "host": "https://beiweixiaosun.github.io",
              "webManifestUrl": "https://beiweixiaosun.github.io/macro-tracker/manifest.json",
              "fallbackType": "customtabs",
              "enableSiteSettingsShortcut": true,
              "orientation": "portrait",
              "minSdkVersion": 21
            }' -o package.zip

          unzip -q package.zip -d output_dir
          echo "文件列表："
          ls -la output_dir

          # 查找生成的 apk 文件
          APK_FILE=$(find output_dir -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "未找到APK文件"
            exit 1
          fi

          # 如果生成的是 unsigned.apk，使用云端自带的 Android apksigner 自动盖章签名
          if [[ "$APK_FILE" == *"unsigned"* ]]; then
            echo "检测到未签名APK，正在自动生成密钥并签名..."
            keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass 123456 -keypass 123456 -dname "CN=DietTracker, OU=App, O=Beiwei, L=SG, S=SG, C=SG"
            
            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
            
            "$ZIPALIGN" -v -p 4 "$APK_FILE" aligned.apk
            "$APKSIGNER" sign --ks my-release-key.jks --ks-pass pass:123456 --key-pass pass:123456 --out "膳食追踪-已签名正式版.apk" aligned.apk
          else
            cp "$APK_FILE" "膳食追踪-已签名正式版.apk"
          fi

          ls -lh "膳食追踪-已签名正式版.apk"

      - name: 4. 上传已签名APK供直接下载
        uses: actions/upload-artifact@v4
        with:
          name: 膳食追踪-安卓安装包-已签名
          path: 膳食追踪-已签名正式版.apk
